    <script>
        (function() {
            // ============================================================
            // 1. 配置
            // ============================================================
            const FILTER_KEYWORDS = [
                "failed to",
                "PacketEvents caught an unhandled exception while calling your listener",
                "	at ",
                "	... ",
                "java.lang.",
                "io.netty.",
                "ERROR",
                "java.lang",
                "at java",
                "at knot",
                "io.netty",
                "java.util",
                "Caused by",
                "Failed to decode value",
                "generated an exception while executing",
            ];
            const HIGHLIGHT_RULES = [
                { keyword: "Server empty for", color: "#ff0000" },
                { keyword: "error", color: "#ff0000" },
                { keyword: "warn", color: "#fbff00" },
                { keyword: "java.lang", color: "#fbff00" },
                { keyword: "IP limit exceeded", color: "#00ffea" },
                { keyword: "触发了", color: "#00ffea" },
                { keyword: "反作弊", color: "#00ffea" },
                { keyword: "Grim", color: "#00ffea" },
                { keyword: "meteor", color: "#00ffea" },
                { keyword: "liquid", color: "#00ffea" },
                { keyword: "wurst", color: "#00ffea" },
                { keyword: "Successfully filled", color: "#666666" },
                { keyword: "Changed the block at", color: "#666666" },
                { keyword: "lost connection", color: "#666666" },
                { keyword: "left the game", color: "#666666" },
                { keyword: "[voicechat]", color: "#666666" },
                { keyword: "Disconnecting", color: "#666666" },
                { keyword: "Thread RCON", color: "#666666" },
                { keyword: "logged in with entity", color: "#3BF010" },
                { keyword: "info", color: "#ffffff" }
            ];

            const DEFAULT_ANTICHEAT_CONFIG = {
                leftKeywords: ["触发了", "[Server]"],
                rightKeywords: ["[Server]", "moved too quickly"]
            };

            // ============================================================
            // 2. 状态对象
            // ============================================================
            const AppState = {
                currentTab: "console",
                chatLines: [],
                joinQuitLines: [],
                grimLines: [],
                serverLines: [],
                rawDisplayLines: [],
                ipLoginRecords: [],
                expandedIps: new Set(),
                expandedGroups: new Set(),
                autoScrollEnabled: true,
                autoWrapEnabled: false,
                filterEnabled: true,
                ipLocationCache: new Map(),
                highlightRules: HIGHLIGHT_RULES,
                anticheatConfig: { ...DEFAULT_ANTICHEAT_CONFIG },
                totalLines: 0,
                processing: false,
                monacoEditor: null,
                monacoModel: null,
                monacoDecorations: null,
            };

            // ============================================================
            // 3. 工具函数
            // ============================================================
            const Utils = {
                escapeHtml(str) {
                    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '>');
                },
                getHighlightColor(line, rules) {
                    for (const r of rules) {
                        if (line.toLowerCase().includes(r.keyword.toLowerCase())) return r.color;
                    }
                    return "";
                },
                isContainerAtBottom(el) {
                    if (!el) return true;
                    return el.scrollHeight - el.scrollTop - el.clientHeight <= 5;
                },
                scrollContainerToBottom(el) {
                    if (el) el.scrollTop = el.scrollHeight;
                },
                smoothScrollToBottomDynamic(el, duration = 200) {
                    if (!el) return;
                    if (el._scrollAnim) cancelAnimationFrame(el._scrollAnim);
                    const startTop = el.scrollTop,
                        startTime = performance.now();
                    const animate = (now) => {
                        const elapsed = now - startTime;
                        let t = Math.min(elapsed / duration, 1);
                        const ease = t * (2 - t);
                        const targetTop = el.scrollHeight - el.clientHeight;
                        const newTop = startTop + (targetTop - startTop) * ease;
                        el.scrollTop = Math.min(Math.max(newTop, 0), targetTop);
                        if (t < 1) el._scrollAnim = requestAnimationFrame(animate);
                        else { el.scrollTop = targetTop;
                            delete el._scrollAnim; }
                    };
                    el._scrollAnim = requestAnimationFrame(animate);
                },
                smoothScrollToTop(el, duration = 200) {
                    if (!el) return;
                    if (el._scrollAnim) cancelAnimationFrame(el._scrollAnim);
                    const startTop = el.scrollTop;
                    if (startTop === 0) return;
                    const startTime = performance.now();
                    const animate = (now) => {
                        const elapsed = now - startTime;
                        let t = Math.min(elapsed / duration, 1);
                        const ease = t * (2 - t);
                        el.scrollTop = startTop * (1 - ease);
                        if (t < 1) el._scrollAnim = requestAnimationFrame(animate);
                        else {
                            delete el._scrollAnim;
                            AppState.autoScrollEnabled = false;
                            const chk = document.getElementById('auto-scroll');
                            if (chk) chk.checked = false;
                        }
                    };
                    el._scrollAnim = requestAnimationFrame(animate);
                },
                extractProvinceCity(full) {
                    if (!full) return { province: "未知", city: "", full: "未知" };
                    let str = full.replace(/^中国\s*/, "");
                    let province = "未知";
                    const provinces = ["北京", "天津", "上海", "重庆", "河北", "山西", "辽宁", "吉林", "黑龙江", "江苏", "浙江", "安徽",
                        "福建", "江西", "山东", "河南", "湖北", "湖南", "广东", "海南", "四川", "贵州", "云南", "陕西", "甘肃",
                        "青海", "台湾", "内蒙古", "广西", "西藏", "宁夏", "新疆", "香港", "澳门"
                    ];
                    for (const p of provinces)
                        if (str.startsWith(p)) { province = p; break; }
                    return { province, city: "", full: str };
                }
            };
            const provinceMap = {
                "Anhui": "安徽",
                "Beijing": "北京",
                "Chongqing": "重庆",
                "Fujian": "福建",
                "Gansu": "甘肃",
                "Guangdong": "广东",
                "Guangxi": "广西",
                "Guizhou": "贵州",
                "Hainan": "海南",
                "Hebei": "河北",
                "Heilongjiang": "黑龙江",
                "Henan": "河南",
                "Hubei": "湖北",
                "Hunan": "湖南",
                "Inner Mongolia": "内蒙古",
                "Jiangsu": "江苏",
                "Jiangxi": "江西",
                "Jilin": "吉林",
                "Liaoning": "辽宁",
                "Ningxia": "宁夏",
                "Qinghai": "青海",
                "Shaanxi": "陕西",
                "Shandong": "山东",
                "Shanghai": "上海",
                "Shanxi": "山西",
                "Sichuan": "四川",
                "Tianjin": "天津",
                "Tibet": "西藏",
                "Xinjiang": "新疆",
                "Yunnan": "云南",
                "Zhejiang": "浙江",
                "Hong Kong": "香港",
                "Macao": "澳门",
                "Taiwan": "台湾"
            };

            // ============================================================
            // 4. IP 归属地查询服务
            // ============================================================
            const IpLocationService = {
                _apiFetchers: [{
                    name: 'ip-api.com',
                    fetch: async (ips) => {
                        const resp = await fetch("http://ip-api.com/batch", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(ips)
                        });
                        const data = await resp.json();
                        if (!Array.isArray(data) || data.length !== ips.length) {
                            throw new Error("返回格式错误或长度不匹配");
                        }
                        return data;
                    }
                }, {
                    name: 'ipapi.co',
                    fetch: async (ips) => {
                        const results = [];
                        for (const ip of ips) {
                            try {
                                const resp = await fetch(`https://ipapi.co/${ip}/json/`);
                                const data = await resp.json();
                                if (data.error) throw new Error(data.reason);
                                results.push({
                                    status: "success",
                                    country: data.country_name,
                                    regionName: data.region,
                                    city: data.city
                                });
                            } catch {
                                results.push({ status: "fail" });
                            }
                        }
                        return results;
                    }
                }, {
                    name: 'ipinfo.io',
                    fetch: async (ips) => {
                        const results = [];
                        for (const ip of ips) {
                            try {
                                const resp = await fetch(`https://ipinfo.io/${ip}/json`);
                                const data = await resp.json();
                                if (data.bogon || data.error) throw new Error("无效IP");
                                results.push({
                                    status: "success",
                                    country: data.country,
                                    regionName: data.region,
                                    city: data.city
                                });
                            } catch {
                                results.push({ status: "fail" });
                            }
                        }
                        return results;
                    }
                }],

                async batchQuery(ips, progressCb) {
                    const resultMap = new Map();
                    let completed = 0;
                    const chunks = [];
                    for (let i = 0; i < ips.length; i += 100) chunks.push(ips.slice(i, i + 100));

                    for (const chunk of chunks) {
                        const needQuery = chunk.filter(ip => !AppState.ipLocationCache.has(ip));
                        if (needQuery.length > 0) {
                            let batchSuccess = false;
                            for (const api of this._apiFetchers) {
                                try {
                                    const data = await api.fetch(needQuery);
                                    for (let idx = 0; idx < needQuery.length; idx++) {
                                        const ip = needQuery[idx],
                                            info = data[idx];
                                        let loc = { province: "未知", city: "", full: "未知" };
                                        if (info && info.status === "success") {
                                            let region = info.regionName || "";
                                            if (provinceMap[region]) region = provinceMap[region];
                                            const fullStr =
                                                `${info.country} ${region} ${info.city}`;
                                            loc = Utils.extractProvinceCity(fullStr);
                                            if (loc.province === "未知" && region) {
                                                loc.province = region;
                                                loc.full = `${info.country} ${region}`;
                                            } else if (loc.province !== "未知") {
                                                loc.full = `${info.country} ${loc.province}`;
                                            }
                                        }
                                        AppState.ipLocationCache.set(ip, loc);
                                        resultMap.set(ip, loc);
                                        completed++;
                                        if (progressCb) progressCb(completed, ips.length);
                                    }
                                    batchSuccess = true;
                                    break;
                                } catch (e) {
                                    console.warn(`${api.name} 查询失败:`, e);
                                }
                            }
                            if (!batchSuccess) {
                                for (const ip of needQuery) {
                                    const loc = { province: "未知", city: "", full: "未知" };
                                    AppState.ipLocationCache.set(ip, loc);
                                    resultMap.set(ip, loc);
                                    completed++;
                                    if (progressCb) progressCb(completed, ips.length);
                                }
                            }
                            if (chunks.length > 1) await new Promise(r => setTimeout(r, 1000));
                        } else {
                            for (const ip of chunk) {
                                resultMap.set(ip, AppState.ipLocationCache.get(ip));
                                completed++;
                                if (progressCb) progressCb(completed, ips.length);
                            }
                        }
                    }
                    return resultMap;
                }
            };

            // ============================================================
            // 5. 核心数据处理
            // ============================================================
            const DataProcessor = {
                extractPlayerName(line) {
                    const m = line.match(/([a-zA-Z0-9_]+)\s*\[\/\d+\.\d+\.\d+\.\d+:\d+\]/);
                    return m ? m[1] : "";
                },
                processLineData(line) {
                    const shouldFilter = FILTER_KEYWORDS.some(kw => line.toLowerCase().includes(kw
                        .toLowerCase()));

                    const text = line;

                    if (!shouldFilter) {
                        const isChat = text.includes("聊") || text.includes("[Not Secure]") || text.includes(
                                "[Server]") ||
                            text.includes("[Rcon]") || text.includes("[TEAM_ONLY]") || text.includes("[SHOUT]") ||
                            /<[a-zA-Z0-9_]+>/.test(text);
                        const isQuit = text.includes("lost connection") || text.includes("left the game") || text
                            .includes("Disconnecting");
                        const isLogin = text.includes("logged in");
                        const isGrim = AppState.anticheatConfig.leftKeywords.some(kw => text.includes(kw));
                        const isServer = AppState.anticheatConfig.rightKeywords.some(kw => text.includes(kw));

                        let cleaned = text.replace(/\[Server thread\/INFO\]: \[Not Secure\] /, "").replace(
                            /\[Server thread\/INFO\]: /, "");
                        if (isChat) AppState.chatLines.push(cleaned);
                        if (isQuit) AppState.joinQuitLines.push(cleaned);
                        if (isGrim) AppState.grimLines.push(cleaned);
                        if (isServer) AppState.serverLines.push(cleaned);
                        if (isLogin) {
                            const timeMatch = line.match(/\[(\d{2}:\d{2}:\d{2})\]/);
                            const player = this.extractPlayerName(line);
                            const ipMatch = line.match(/\/(\d+\.\d+\.\d+\.\d+):\d+\]/);
                            if (timeMatch && player && ipMatch) {
                                AppState.ipLoginRecords.push({ time: timeMatch[1], player, ip: ipMatch[1] });
                            }
                        }
                    }

                    return { text: line, filtered: shouldFilter };
                }
            };

            // ============================================================
            // 6. UI 管理器
            // ============================================================
            const UIManager = {
                elements: {},
                _scrollCheckTimer: null,
                init() {
                    this.elements = {
                        status: document.getElementById('status'),
                        autoScroll: document.getElementById('auto-scroll'),
                        autoWrap: document.getElementById('auto-wrap'),
                        filterErrors: document.getElementById('filter-errors'),
                        chatText: document.getElementById('chat-text'),
                        joinquitText: document.getElementById('joinquit-text'),
                        grimText: document.getElementById('grim-text'),
                        serverText: document.getElementById('server-text'),
                        ipPanel: document.getElementById('ip-panel'),
                        ipInput: document.getElementById('ip-input'),
                        ipResult: document.getElementById('ip-query-result'),
                        progressDiv: document.getElementById('log-load-progress'),
                        grimLeftInput: document.getElementById('grim-left-keywords'),
                        grimRightInput: document.getElementById('grim-right-keywords'),
                        grimConfigPanel: document.getElementById('grim-config-panel'),
                        grimConfigToggle: document.getElementById('grim-config-toggle'),
                    };
                    this.bindEvents();
                    this.setAllWrapMode(AppState.autoWrapEnabled);
                    this.loadAnticheatConfig();
                    this.initMonaco();
                },
                loadAnticheatConfig() {
                    try {
                        const saved = localStorage.getItem('anticheatConfig');
                        if (saved) {
                            const config = JSON.parse(saved);
                            if (config.leftKeywords && config.rightKeywords) {
                                AppState.anticheatConfig = config;
                            }
                        }
                    } catch (e) {}
                    this.elements.grimLeftInput.value = AppState.anticheatConfig.leftKeywords.join(',');
                    this.elements.grimRightInput.value = AppState.anticheatConfig.rightKeywords.join(',');
                },
                saveAnticheatConfig(config) {
                    localStorage.setItem('anticheatConfig', JSON.stringify(config));
                },
                // 新增：初始化 Monaco Editor
                initMonaco() {
                    const self = this;
                    // 必须添加：显示遮罩，确保 CDN 加载期间禁止用户操作
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.style.display = 'flex';

                    require(['vs/editor/editor.main'], function() {
                        const container = document.getElementById('monaco-container');
                        if (!container) return;

                        // 动态生成颜色 CSS 类（完美保留原高亮规则）
                        const style = document.createElement('style');
                        let css = '';
                        AppState.highlightRules.forEach(rule => {
                            const color = rule.color.replace('#', '');
                            css += `.color-${color} { color: ${rule.color} !important; }`;
                        });
                        style.innerHTML = css;
                        document.head.appendChild(style);

                        AppState.monacoModel = monaco.editor.createModel('', 'plaintext');
                        AppState.monacoEditor = monaco.editor.create(container, {
                            model: AppState.monacoModel,
                            theme: 'vs-dark',
                            minimap: {
                                enabled: true, 
                                renderCharacters: false
                            },
                            wordWrap: AppState.autoWrapEnabled ? 'on' : 'off',
                            scrollBeyondLastLine: false,
                            automaticLayout: true,
                            readOnly: true,
                            lineNumbers: true,
                            fontSize: 13,
                            lineHeight: 20
                        });

                        // 监听滚动更新自动滚动复选框（防抖）
                        AppState.monacoEditor.onDidScrollChange(function() {
                            self.updateAutoScrollCheck();
                        });

                        // ===== 修复：加载成功，隐藏遮罩解除禁止 =====
                        if (overlay) overlay.style.display = 'none';

                    }, function(err) {
                        // ===== 新增：加载失败提示 =====
                        console.error('Monaco CDN 加载失败:', err);
                        if (overlay) {
                            overlay.innerHTML = '<div style="color: #ff4343; text-align: center;">加载 Monaco 引擎失败！<br>请检查网络连接后刷新页面。</div>';
                        }
                    });
                },
                // 新增：应用颜色高亮
                updateDecorations() {
                    if (!AppState.monacoEditor) return;
                    const model = AppState.monacoEditor.getModel();
                    const rules = AppState.highlightRules;
                    const newDecorations = [];
                    for (let i = 0; i < rules.length; i++) {
                        const rule = rules[i];
                        const regexStr = rule.keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(regexStr, "i");
                        const matches = model.findMatches(regex.source, false, true, true, null, true);
                        for (let j = 0; j < matches.length; j++) {
                            newDecorations.push({
                                range: matches[j].range,
                                options: { 
                                    isWholeLine: true, 
                                    inlineClassName: 'color-' + rule.color.replace('#', '') 
                                }
                            });
                        }
                    }
                    if (AppState.monacoDecorations) {
                        AppState.monacoDecorations.clear();
                    }
                    AppState.monacoDecorations = AppState.monacoEditor.createDecorationsCollection(newDecorations);
                },
                bindEvents() {
                    this.elements.autoScroll.addEventListener('change', () => {
                        AppState.autoScrollEnabled = this.elements.autoScroll.checked;
                        if (AppState.autoScrollEnabled) {
                            const tab = AppState.currentTab;
                            if (tab === 'console' && AppState.monacoEditor) {
                                AppState.monacoEditor.revealLineInCenter(AppState.monacoEditor.getModel().getLineCount(), monaco.editor.ScrollType.Smooth);
                            }
                            else if (tab === 'chat') Utils.smoothScrollToBottomDynamic(this.elements.chatText, 200);
                            else if (tab === 'joinquit') Utils.smoothScrollToBottomDynamic(this.elements.joinquitText, 200);
                            else if (tab === 'grim') { Utils.smoothScrollToBottomDynamic(this.elements.grimText, 200);
                                Utils.smoothScrollToBottomDynamic(this.elements.serverText, 200); }
                            else if (tab === 'playerip') Utils.smoothScrollToBottomDynamic(this.elements.ipPanel, 200);
                        }
                    });
                    this.elements.autoWrap.addEventListener('change', () => {
                        this.setAllWrapMode(this.elements.autoWrap.checked);
                    });

                    // 过滤切换：重新加载 Monaco
                    this.elements.filterErrors.addEventListener('change', () => {
                        AppState.filterEnabled = this.elements.filterErrors.checked;
                        this.reloadConsoleLog();
                        this.showStatus(`屏蔽报错: ${AppState.filterEnabled ? '开启' : '关闭'}`, 2000);
                    });

                    // 控制台按钮操作 Monaco
                    document.getElementById('scroll-top-btn').addEventListener('click', () => {
                        if (AppState.monacoEditor) AppState.monacoEditor.revealLine(1);
                    });
                    document.getElementById('scroll-bottom-btn').addEventListener('click', () => {
                        if (AppState.monacoEditor) AppState.monacoEditor.revealLineInCenter(AppState.monacoEditor.getModel().getLineCount(), monaco.editor.ScrollType.Smooth);
                    });
                    document.getElementById('copy-console-btn').addEventListener('click', () => this.copyConsoleContent());

                    document.getElementById('chat-scroll-top')?.addEventListener('click', () => Utils.smoothScrollToTop(this.elements.chatText, 200));
                    document.getElementById('chat-scroll-bottom')?.addEventListener('click', () => Utils.smoothScrollToBottomDynamic(this.elements.chatText, 200));
                    document.getElementById('joinquit-scroll-top')?.addEventListener('click', () => Utils.smoothScrollToTop(this.elements.joinquitText, 200));
                    document.getElementById('joinquit-scroll-bottom')?.addEventListener('click', () => Utils.smoothScrollToBottomDynamic(this.elements.joinquitText, 200));
                    document.getElementById('ip-scroll-top')?.addEventListener('click', () => Utils.smoothScrollToTop(this.elements.ipPanel, 200));
                    document.getElementById('ip-scroll-bottom')?.addEventListener('click', () => Utils.smoothScrollToBottomDynamic(this.elements.ipPanel, 200));

                    document.getElementById('query-ip-btn').addEventListener('click', () => this.queryIP(this.elements.ipInput.value));
                    this.elements.ipInput.addEventListener('keypress', e => { if (e.key === 'Enter') this.queryIP(this.elements.ipInput.value); });

                    document.getElementById('collapse-all-btn').addEventListener('click', () => this.collapseAllIps());
                    document.getElementById('expand-all-btn').addEventListener('click', () => this.expandAllGroups());
                    document.getElementById('batch-query-ip-btn').addEventListener('click', () => this.batchQueryIpLocation());

                    this.elements.ipPanel.addEventListener('click', e => this.handleIpPanelClick(e));

                    // 其他容器的滚动监听
                    ['chatText', 'joinquitText', 'grimText', 'serverText', 'ipPanel'].forEach(key => {
                        const el = this.elements[key];
                        if (el) {
                            el.addEventListener('scroll', () => {
                                const atBottom = Utils.isContainerAtBottom(el);
                                if (this.elements.autoScroll.checked !== atBottom) {
                                    this.elements.autoScroll.checked = atBottom;
                                    AppState.autoScrollEnabled = atBottom;
                                }
                            });
                        }
                    });

                    document.querySelectorAll('.tab-button').forEach(btn => {
                        btn.addEventListener('click', () => this.switchTab(btn.getAttribute('data-tab')));
                    });

                    this.elements.grimConfigToggle.addEventListener('click', () => {
                        const panel = this.elements.grimConfigPanel;
                        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
                    });
                    document.getElementById('grim-apply-config').addEventListener('click', () => this.applyAnticheatConfig());
                    document.getElementById('grim-reset-config').addEventListener('click', () => this.resetAnticheatConfig());
                    document.getElementById('grim-cancel-config').addEventListener('click', () => {
                        this.elements.grimConfigPanel.style.display = 'none';
                        this.elements.grimLeftInput.value = AppState.anticheatConfig.leftKeywords.join(',');
                        this.elements.grimRightInput.value = AppState.anticheatConfig.rightKeywords.join(',');
                    });
                },
                applyAnticheatConfig() {
                    const leftRaw = this.elements.grimLeftInput.value.trim();
                    const rightRaw = this.elements.grimRightInput.value.trim();
                    const leftKeywords = leftRaw.split(',').map(k => k.trim()).filter(k => k.length > 0);
                    const rightKeywords = rightRaw.split(',').map(k => k.trim()).filter(k => k.length > 0);

                    const newConfig = { leftKeywords, rightKeywords };
                    AppState.anticheatConfig = newConfig;
                    this.saveAnticheatConfig(newConfig);

                    this.reclassifyAnticheatLines();
                    this.elements.grimConfigPanel.style.display = 'none';
                    this.showStatus('反作弊关键词已更新', 2000);
                },
                resetAnticheatConfig() {
                    AppState.anticheatConfig = { ...DEFAULT_ANTICHEAT_CONFIG };
                    this.saveAnticheatConfig(AppState.anticheatConfig);
                    this.elements.grimLeftInput.value = AppState.anticheatConfig.leftKeywords.join(',');
                    this.elements.grimRightInput.value = AppState.anticheatConfig.rightKeywords.join(',');
                    this.reclassifyAnticheatLines();
                    this.showStatus('已重置为默认关键词', 2000);
                },
                reclassifyAnticheatLines() {
                    const leftKeys = AppState.anticheatConfig.leftKeywords;
                    const rightKeys = AppState.anticheatConfig.rightKeywords;
                    const newGrim = [];
                    const newServer = [];
                    const lines = AppState.rawDisplayLines;
                    const BATCH = 5000;
                    let index = 0;
                    const statusEl = this.elements.status;
                    const progressEl = document.getElementById('log-load-progress');
                    progressEl.style.display = 'block';
                    const total = lines.length;

                    const processBatch = () => {
                        const end = Math.min(index + BATCH, total);
                        for (let i = index; i < end; i++) {
                            const line = lines[i];
                            const cleaned = line.replace(/\[Server thread\/INFO\]: \[Not Secure\] /, "")
                                .replace(/\[Server thread\/INFO\]: /, "");
                            if (leftKeys.some(k => line.includes(k))) newGrim.push(cleaned);
                            if (rightKeys.some(k => line.includes(k))) newServer.push(cleaned);
                        }
                        index = end;
                        const pct = Math.round((index / total) * 100);
                        statusEl.innerText = `正在重新分类反作弊日志... ${index}/${total} (${pct}%)`;
                        progressEl.innerText = ` 🔄 重新过滤 ${index}/${total} (${pct}%)`;
                        if (index < total) {
                            requestAnimationFrame(processBatch);
                        } else {
                            AppState.grimLines = newGrim;
                            AppState.serverLines = newServer;
                            this.updateNonConsoleTab();
                            progressEl.style.display = 'none';
                            statusEl.innerText =
                                `${AppState.totalLines} 行日志已加载`;
                            if (AppState.currentTab === 'grim' && AppState.autoScrollEnabled) {
                                Utils.smoothScrollToBottomDynamic(this.elements.grimText, 200);
                                Utils.smoothScrollToBottomDynamic(this.elements.serverText, 200);
                            }
                        }
                    };
                    requestAnimationFrame(processBatch);
                },
                setAllWrapMode(enabled) {
                    const style = enabled ? "pre-wrap" : "pre";
                    const wordWrap = enabled ? "break-word" : "normal";
                    const set = (el) => {
                        if (!el) return;
                        if (el.tagName === "TEXTAREA") { el.style.whiteSpace = style; el.style.wordWrap = wordWrap; } else { el.style.whiteSpace = style; el.style.wordWrap = wordWrap; }
                    };
                    set(this.elements.chatText);
                    set(this.elements.joinquitText);
                    set(this.elements.grimText);
                    set(this.elements.serverText);
                    // Monaco 自动换行
                    if (AppState.monacoEditor) {
                        AppState.monacoEditor.updateOptions({ wordWrap: enabled ? 'on' : 'off' });
                    }
                    AppState.autoWrapEnabled = enabled;
                },
                // 重构后的 appendConsoleLines：加入 Monaco
                appendConsoleLines(lineObjects) {
                    if (!lineObjects || lineObjects.length === 0) return;
                    let validLines = lineObjects;
                    if (AppState.filterEnabled) {
                        validLines = lineObjects.filter(obj => !obj.filtered);
                    }
                    if (validLines.length === 0 || !AppState.monacoEditor) return;
                    const model = AppState.monacoEditor.getModel();
                    const lastLine = model.getLineCount();
                    const text = validLines.map(obj => obj.text).join('\n');
                    model.pushEditOperations([], [{
                        range: new monaco.Range(lastLine, model.getLineMaxColumn(lastLine), lastLine, model.getLineMaxColumn(lastLine)),
                        text: '\n' + text,
                        forceMoveMarkers: true
                    }]);
                    if (AppState.autoScrollEnabled) {
                        AppState.monacoEditor.revealLineInCenter(model.getLineCount(), monaco.editor.ScrollType.Smooth);
                    }
                    this.updateDecorations();
                },
                // 切换过滤时的重新加载
                reloadConsoleLog() {
                    if (!AppState.monacoEditor || !AppState.rawDisplayLines) return;
                    const model = AppState.monacoEditor.getModel();
                    model.setValue('');
                    const text = AppState.rawDisplayLines
                        .filter(line => {
                            if (!AppState.filterEnabled) return true;
                            const result = DataProcessor.processLineData(line);
                            return !result.filtered;
                        })
                        .join('\n');
                    model.setValue(text);
                    this.updateDecorations();
                    if (AppState.autoScrollEnabled) {
                        AppState.monacoEditor.revealLineInCenter(model.getLineCount(), monaco.editor.ScrollType.Smooth);
                    }
                },
                updateNonConsoleTab() {
                    this.updateTextareaWithSelection(this.elements.chatText, AppState.chatLines.join('\n'));
                    const sortedJoinQuit = [...AppState.joinQuitLines].sort((a, b) => {
                        const t1 = (a.match(/\[(\d{2}:\d{2}:\d{2})\]/) || [])[1];
                        const t2 = (b.match(/\[(\d{2}:\d{2}:\d{2})\]/) || [])[1];
                        if (t1 && t2) return t1.localeCompare(t2);
                        return 0;
                    });
                    this.updateTextareaWithSelection(this.elements.joinquitText, sortedJoinQuit.join('\n'));
                    this.updateTextareaWithSelection(this.elements.grimText, AppState.grimLines.join('\n'));
                    this.updateTextareaWithSelection(this.elements.serverText, AppState.serverLines.join('\n'));
                    if (AppState.currentTab === 'playerip') this.renderIpPanel();
                },
                updateTextareaWithSelection(textarea, value) {
                    if (!textarea) return;
                    const selStart = textarea.selectionStart,
                        selEnd = textarea.selectionEnd;
                    textarea.value = value;
                    if (selStart !== undefined && selEnd !== undefined && value.length >= selEnd) {
                        textarea.selectionStart = selStart;
                        textarea.selectionEnd = selEnd;
                    } else if (selStart !== undefined && value.length >= selStart) {
                        textarea.selectionStart = selStart;
                        textarea.selectionEnd = selStart;
                    }
                },
                renderIpPanel() {
                    const ipMap = new Map();
                    for (const rec of AppState.ipLoginRecords) {
                        if (!ipMap.has(rec.ip)) ipMap.set(rec.ip, { records: [], playersSet: new Set() });
                        const entry = ipMap.get(rec.ip);
                        entry.records.push({ time: rec.time, player: rec.player });
                        entry.playersSet.add(rec.player);
                    }
                    if (ipMap.size === 0) {
                        this.elements.ipPanel.innerHTML =
                            '<div style="color:#aaa;padding:12px;text-align:center;">无登录记录</div>';
                        return;
                    }
                    const ipItems = [];
                    for (const [ip, data] of ipMap.entries()) {
                        let province = "未知";
                        const cached = AppState.ipLocationCache.get(ip);
                        if (cached && cached.province) province = cached.province;
                        ipItems.push({
                            ip,
                            province,
                            fullLocation: cached ? cached.full : "未知",
                            records: data.records,
                            totalLogins: data.records.length,
                            uniquePlayers: data.playersSet.size,
                            playerNames: Array.from(data.playersSet).sort()
                        });
                    }
                    const groupMap = new Map();
                    for (const item of ipItems) {
                        const key = item.province;
                        if (!groupMap.has(key)) groupMap.set(key, { province: item.province, items: [],
                            totalLogins: 0, uniquePlayersSet: new Set() });
                        const grp = groupMap.get(key);
                        grp.items.push(item);
                        grp.totalLogins += item.totalLogins;
                        item.playerNames.forEach(p => grp.uniquePlayersSet.add(p));
                    }
                    let html = "";
                    const sortedGroups = Array.from(groupMap.entries()).sort((a, b) => b[1].items.length - a[1].items
                        .length);
                    for (const [prov, grp] of sortedGroups) {
                        const groupExpanded = AppState.expandedGroups.has(prov);
                        html +=
                            `<div class="ip-group" data-group-key="${prov}">
                    <div class="ip-group-header" data-group-key="${prov}">
                        <span class="group-toggle-icon">${groupExpanded ? "▼" : "▶"}</span>
                        <span class="group-title">${prov}</span>
                        <span class="group-stats">(${grp.items.length}个IP, ${grp.totalLogins}次登录, ${grp.uniquePlayersSet.size}个玩家)</span>
                    </div>
                    <div class="ip-group-content" data-group-key="${prov}" style="${groupExpanded ? "" : "display:none;"}">`;
                        for (const item of grp.items) {
                            const cls = item.uniquePlayers > 1 ? "multi-player" : "single-player";
                            const playerNames = item.playerNames.join(" // ");
                            const ipExpanded = AppState.expandedIps.has(item.ip);
                            html +=
                                `<div class="ip-card" data-ip="${item.ip}">
                        <div class="ip-header" data-ip="${item.ip}">
                            <span class="toggle-icon">${ipExpanded ? "▼" : "▶"}</span>
                            <span class="ip-address ${cls}" data-ip="${item.ip}">${item.ip}</span>
                            <span class="stats">(${item.totalLogins}次登录, ${item.uniquePlayers}个玩家: ${playerNames})</span>
                        </div>
                        <div class="ip-details ${ipExpanded ? "expanded" : ""}" data-ip="${item.ip}">`;
                            const sortedRecs = [...item.records].sort((a, b) => a.time.localeCompare(b.time));
                            for (const rec of sortedRecs) {
                                html +=
                                    `<div class="login-record-row"><span class="login-record-time">${rec.time}</span><span class="login-record-player">${Utils.escapeHtml(rec.player)}</span></div>`;
                            }
                            html += `</div></div>`;
                        }
                        html += `</div></div>`;
                    }
                    this.elements.ipPanel.innerHTML = html;
                    if (AppState.autoScrollEnabled && AppState.currentTab === 'playerip') {
                        Utils.smoothScrollToBottomDynamic(this.elements.ipPanel, 200);
                    }
                },
                handleIpPanelClick(e) {
                    const groupHeader = e.target.closest(".ip-group-header");
                    if (groupHeader) {
                        const key = groupHeader.getAttribute("data-group-key");
                        if (key) {
                            const content = this.elements.ipPanel.querySelector(
                                `.ip-group-content[data-group-key="${key}"]`);
                            const icon = groupHeader.querySelector(".group-toggle-icon");
                            if (content) {
                                if (content.style.display !== "none") {
                                    content.style.display = "none";
                                    if (icon) icon.textContent = "▶";
                                    AppState.expandedGroups.delete(key);
                                } else {
                                    content.style.display = "block";
                                    if (icon) icon.textContent = "▼";
                                    AppState.expandedGroups.add(key);
                                }
                            }
                        }
                        e.stopPropagation();
                        return;
                    }
                    const ipAddrSpan = e.target.closest(".ip-address");
                    if (ipAddrSpan) {
                        const ip = ipAddrSpan.getAttribute("data-ip");
                        if (ip) { this.elements.ipInput.value = ip;
                            this.queryIP(ip); }
                        e.stopPropagation();
                        return;
                    }
                    const ipHeader = e.target.closest(".ip-header");
                    if (ipHeader) {
                        const ip = ipHeader.getAttribute("data-ip");
                        if (ip) {
                            const details = this.elements.ipPanel.querySelector(`.ip-details[data-ip="${ip}"]`);
                            const icon = ipHeader.querySelector(".toggle-icon");
                            if (details) {
                                if (details.classList.contains("expanded")) {
                                    details.classList.remove("expanded");
                                    if (icon) icon.textContent = "▶";
                                    AppState.expandedIps.delete(ip);
                                } else {
                                    details.classList.add("expanded");
                                    if (icon) icon.textContent = "▼";
                                    AppState.expandedIps.add(ip);
                                }
                            }
                        }
                    }
                },
                collapseAllIps() {
                    const contents = this.elements.ipPanel.querySelectorAll(".ip-group-content");
                    contents.forEach(c => c.style.display = "none");
                    const icons = this.elements.ipPanel.querySelectorAll(".group-toggle-icon");
                    icons.forEach(icon => { if (icon) icon.textContent = "▶"; });
                    AppState.expandedGroups.clear();
                },
                expandAllGroups() {
                    const contents = this.elements.ipPanel.querySelectorAll(".ip-group-content");
                    contents.forEach(c => c.style.display = "block");
                    const icons = this.elements.ipPanel.querySelectorAll(".group-toggle-icon");
                    icons.forEach(icon => { if (icon) icon.textContent = "▼"; });
                    const groups = this.elements.ipPanel.querySelectorAll(".ip-group");
                    groups.forEach(g => {
                        const key = g.getAttribute("data-group-key");
                        if (key) AppState.expandedGroups.add(key);
                    });
                },
                async batchQueryIpLocation() {
                    const ipsSet = new Set();
                    for (const rec of AppState.ipLoginRecords) ipsSet.add(rec.ip);
                    const ips = Array.from(ipsSet);
                    if (ips.length === 0) return this.showStatus("没有可查询的IP", 2000);
                    this.showStatus(`正在查询 ${ips.length} 个IP的归属地...`, 0);
                    const btn = document.getElementById('batch-query-ip-btn');
                    btn.disabled = true;
                    btn.textContent = "查询中...";
                    try {
                        await IpLocationService.batchQuery(ips, (done, total) => {
                            this.showStatus(`查询进度: ${done}/${total}`, 0);
                        });
                        this.showStatus(`查询完成，共 ${ips.length} 个IP`, 2000);
                        this.renderIpPanel();
                    } catch (e) {
                        console.error(e);
                        this.showStatus("查询失败，请重试", 2000);
                    } finally {
                        btn.disabled = false;
                        btn.textContent = "查询IP地址";
                    }
                },
                async queryIP(ip) {
                    if (!ip.trim()) return this.elements.ipResult.innerText = "请输入 IP";
                    const resultEl = this.elements.ipResult;
                    const apis = [
                        { name: "结果1", fetch: async ip => {
                                const resp = await fetch("https://api.ip77.net/ip2/v4/", {
                                    method: "POST",
                                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                                    body: `ip=${encodeURIComponent(ip)}`
                                });
                                const data = await resp.json();
                                if (data.code !== 0 || !data.data) throw new Error(data.error || "查询失败");
                                const d = data.data;
                                return { location: d.location || "未知", lat: d.latitude, lng: d.longitude,
                                    street: d.street_history?.length ? d.street_history.join("、") :
                                        "无街道信息" };
                            } }, { name: "结果2", fetch: async ip => {
                                const resp = await fetch(
                                    `http://ip-api.com/json/${ip}?fields=status,country,regionName,city,lat,lon,isp,org`
                                    );
                                const data = await resp.json();
                                if (data.status !== "success") throw new Error(data.message || "查询失败");
                                return { location: `${data.country} ${data.regionName} ${data.city}`,
                                    lat: data.lat, lng: data.lon, street: `ISP: ${data.isp || "未知"}` };
                            } }, { name: "结果3", fetch: async ip => {
                                const resp = await fetch(`https://ipapi.co/${ip}/json/`);
                                const data = await resp.json();
                                if (data.error) throw new Error(data.reason || "查询失败");
                                return { location: `${data.country_name} ${data.region} ${data.city}`,
                                    lat: data.latitude, lng: data.longitude,
                                street: `ASN: ${data.asn}` };
                            } }, { name: "结果4", fetch: async ip => {
                                const resp = await fetch(`https://ipinfo.io/${ip}/json`);
                                const data = await resp.json();
                                if (data.bogon || data.error) throw new Error(data.error || "查询失败");
                                return { location: `${data.country} ${data.region} ${data.city}`,
                                    lat: data.loc?.split(",")[0], lng: data.loc?.split(",")[1],
                                    street: `组织: ${data.org || "未知"}` };
                            } }, { name: "结果5", fetch: async ip => {
                                const resp = await fetch(`https://ipwho.is/${ip}`);
                                const data = await resp.json();
                                if (!data.success) throw new Error(data.message || "查询失败");
                                return { location: `${data.country} ${data.region} ${data.city}`,
                                    lat: data.latitude, lng: data.longitude,
                                    street: `代理: ${data.proxy ? "是" : "否"} | ISP: ${data.isp || "未知"}` };
                            } }
                    ];
                    let html = '';
                    for (let i = 0; i < apis.length; i++) {
                        html +=
                            `<div id="ip-result-${i}" style="white-space:pre-wrap;font-family:monospace;padding:4px 0;">\n\n【${apis[i].name}】\n查询中...</div>`;
                    }
                    resultEl.innerHTML = html;
                    apis.forEach((api, idx) => {
                        api.fetch(ip)
                            .then(data => {
                                const el = document.getElementById(`ip-result-${idx}`);
                                if (el) {
                                    el.innerText =
                                        `\n\n【${api.name}】\n位置: ${data.location}\n经纬度: ${data.lng},${data.lat}\n详细: ${data.street}`;
                                }
                            })
                            .catch(err => {
                                const el = document.getElementById(`ip-result-${idx}`);
                                if (el) {
                                    el.innerText = `\n\n【${api.name}】\n失败: ${err.message}`;
                                }
                            });
                    });
                },
                async copyConsoleContent() {
                    if (!AppState.monacoEditor) return this.showStatus("无内容可复制", 2000);
                    const text = AppState.monacoEditor.getValue();
                    try {
                        await navigator.clipboard.writeText(text);
                        this.showStatus("已复制内容", 2000);
                    } catch {
                        const ta = document.createElement("textarea");
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                        this.showStatus("已复制内容", 2000);
                    }
                },
                showStatus(msg, timeout) {
                    const orig = this.elements.status.innerText;
                    this.elements.status.innerText = msg;
                    if (timeout > 0) setTimeout(() => {
                        if (this.elements.status.innerText === msg) this.elements.status.innerText = orig;
                    }, timeout);
                },
                switchTab(tabId) {
                    AppState.currentTab = tabId;
                    document.querySelectorAll(".tab-button").forEach(btn => {
                        btn.classList.toggle("active", btn.getAttribute("data-tab") === tabId);
                    });
                    document.querySelectorAll(".tab-content").forEach(tc => tc.classList.remove("active"));
                    document.getElementById(`tab-${tabId}`).classList.add("active");
                    if (tabId === 'console') {
                        if (AppState.monacoEditor) AppState.monacoEditor.layout();
                    } else if (tabId === 'playerip') {
                        this.renderIpPanel();
                    } else if (tabId === 'grim') {
                        this.updateTextareaWithSelection(this.elements.grimText, AppState.grimLines.join('\n'));
                        this.updateTextareaWithSelection(this.elements.serverText, AppState.serverLines.join('\n'));
                    } else {
                        this.updateNonConsoleTab();
                    }
                    if (AppState.autoScrollEnabled) {
                        if (tabId === 'console' && AppState.monacoEditor) {
                            AppState.monacoEditor.revealLineInCenter(AppState.monacoEditor.getModel().getLineCount(), monaco.editor.ScrollType.Smooth);
                        }
                        const map = { chat: 'chatText', joinquit: 'joinquitText', grim: 'grimText', playerip: 'ipPanel' };
                        const key = map[tabId];
                        if (key) {
                            const el = this.elements[key];
                            if (el) Utils.smoothScrollToBottomDynamic(el, 200);
                        }
                        if (tabId === 'grim') {
                            Utils.smoothScrollToBottomDynamic(this.elements.serverText, 200);
                        }
                    }
                },
                // 修复后的防抖判断
                updateAutoScrollCheck: function() {
                    const self = this;
                    if (this._scrollCheckTimer) clearTimeout(this._scrollCheckTimer);
                    this._scrollCheckTimer = setTimeout(function() {
                        let allAtBottom = true;
                        if (AppState.monacoEditor) {
                            const scrollTop = AppState.monacoEditor.getScrollTop();
                            const scrollHeight = AppState.monacoEditor.getScrollHeight();
                            const clientHeight = AppState.monacoEditor.getLayoutInfo().height;
                            if (scrollHeight - scrollTop - clientHeight > 5) {
                                allAtBottom = false;
                            }
                        }
                        const containers = [
                            self.elements.chatText,
                            self.elements.joinquitText,
                            self.elements.grimText,
                            self.elements.serverText,
                            self.elements.ipPanel
                        ];
                        for (let i = 0; i < containers.length; i++) {
                            const el = containers[i];
                            if (el && !Utils.isContainerAtBottom(el)) {
                                allAtBottom = false;
                                break;
                            }
                        }
                        if (self.elements.autoScroll.checked !== allAtBottom) {
                            self.elements.autoScroll.checked = allAtBottom;
                            AppState.autoScrollEnabled = allAtBottom;
                        }
                    }, 100);
                },
            };

            // ============================================================
            // 7. 异步分批加载函数
            // ============================================================
            const BATCH_SIZE = 10000;

            function loadLogFromText(text) {
                if (AppState.processing) return;
                AppState.processing = true;

                document.getElementById('upload-overlay').style.display = 'none';

                AppState.chatLines = [];
                AppState.joinQuitLines = [];
                AppState.grimLines = [];
                AppState.serverLines = [];
                AppState.rawDisplayLines = [];
                AppState.ipLoginRecords = [];
                AppState.totalLines = 0;

                // 清空 Monaco
                if (AppState.monacoEditor) {
                    AppState.monacoEditor.setValue('');
                    if (AppState.monacoDecorations) AppState.monacoDecorations.clear();
                }

                const lines = text.split(/\r?\n/);
                const total = lines.length;
                AppState.totalLines = total;

                const statusEl = document.getElementById('status');
                const progressEl = document.getElementById('log-load-progress');
                progressEl.style.display = 'block';

                let processed = 0;

                function processBatch(startIndex) {
                    const endIndex = Math.min(startIndex + BATCH_SIZE, total);
                    const batchLines = lines.slice(startIndex, endIndex);
                    const displayLineObjects = [];

                    for (const raw of batchLines) {
                        const result = DataProcessor.processLineData(raw);
                        displayLineObjects.push(result);
                        AppState.rawDisplayLines.push(result.text);
                    }

                    if (displayLineObjects.length > 0) {
                        UIManager.appendConsoleLines(displayLineObjects);
                    }

                    processed = endIndex;
                    const percent = Math.round((processed / total) * 100);
                    statusEl.innerText = `加载中... ${processed}/${total} (${percent}%)`;
                    progressEl.innerText = `加载日志 ${processed}/${total} (${percent}%)`;

                    if (endIndex < total) {
                        setTimeout(() => processBatch(endIndex), 0);
                    } else {
                        progressEl.style.display = 'none';
                        const visibleCount = AppState.filterEnabled ?
                            AppState.rawDisplayLines.filter(line => {
                                const res = DataProcessor.processLineData(line);
                                return !res.filtered;
                            }).length :
                            AppState.rawDisplayLines.length;
                        statusEl.innerText =
                            `一共 ${total} 行日志，屏蔽部分后有 ${visibleCount} 行可见`;
                        AppState.processing = false;

                        UIManager.updateNonConsoleTab();
                        UIManager.updateDecorations();

                        if (AppState.autoScrollEnabled && AppState.monacoEditor) {
                            AppState.monacoEditor.revealLineInCenter(AppState.monacoEditor.getModel().getLineCount(), monaco.editor.ScrollType.Smooth);
                        }
                    }
                }

                processBatch(0);
            }

            // ============================================================
            // 8. 反作弊标签页分隔条拖拽（离线版）
            // ============================================================
            (function initGrimDivider() {
                const divider = document.getElementById('grim-divider');
                const leftPanel = document.getElementById('grim-left-panel');
                const container = divider?.parentElement;
                if (!divider || !leftPanel || !container) return;

                let isDragging = false;
                let startX = 0;
                let startLeftWidth = 0;

                function getContainerWidth() {
                    return container.getBoundingClientRect().width;
                }

                function setLeftWidth(percent) {
                    const clamped = Math.min(90, Math.max(10, percent));
                    leftPanel.style.width = clamped + '%';
                    return clamped;
                }

                function startDrag(e) {
                    e.preventDefault();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    isDragging = true;
                    divider.classList.add('dragging');
                    startX = clientX;
                    startLeftWidth = leftPanel.getBoundingClientRect().width;
                    document.body.style.userSelect = 'none';
                    document.body.style.webkitUserSelect = 'none';

                    document.addEventListener('mousemove', onDragMove);
                    document.addEventListener('mouseup', onDragEnd);
                    document.addEventListener('touchmove', onDragMove, { passive: false });
                    document.addEventListener('touchend', onDragEnd);
                    document.addEventListener('touchcancel', onDragEnd);
                }

                function onDragMove(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const deltaX = clientX - startX;
                    const containerWidth = getContainerWidth();
                    if (containerWidth <= 0) return;
                    const dividerWidth = divider.offsetWidth || 6;
                    const available = containerWidth - dividerWidth;
                    let newWidth = startLeftWidth + deltaX;
                    let percent = (newWidth / available) * 100;
                    setLeftWidth(percent);
                }

                function onDragEnd() {
                    if (!isDragging) return;
                    isDragging = false;
                    divider.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.webkitUserSelect = '';
                    document.removeEventListener('mousemove', onDragMove);
                    document.removeEventListener('mouseup', onDragEnd);
                    document.removeEventListener('touchmove', onDragMove);
                    document.removeEventListener('touchend', onDragEnd);
                    document.removeEventListener('touchcancel', onDragEnd);
                }

                divider.addEventListener('mousedown', startDrag);
                divider.addEventListener('touchstart', startDrag, { passive: false });

                divider.addEventListener('dblclick', function() {
                    setLeftWidth(50);
                });
            })();

            // ============================================================
            // 9. 初始化
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                UIManager.init();

                const fileInput = document.getElementById('file-input');
                const textInput = document.getElementById('text-input');
                const submitBtn = document.getElementById('submit-log-btn');

                fileInput.addEventListener('change', function() {
                    if (AppState.processing) return;
                    const file = fileInput.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            loadLogFromText(e.target.result);
                        };
                        reader.onerror = function() {
                            alert('读取文件失败');
                        };
                        reader.readAsText(file, 'UTF-8');
                    }
                });

                submitBtn.addEventListener('click', function() {
                    if (AppState.processing) return;
                    const text = textInput.value;
                    if (text.trim()) {
                        loadLogFromText(text);
                    } else {
                        alert('请粘贴日志内容或选择文件');
                    }
                });

                document.body.addEventListener('dragover', (e) => e.preventDefault());
                document.body.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const file = files[0];
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            loadLogFromText(ev.target.result);
                        };
                        reader.readAsText(file, 'UTF-8');
                    }
                });

                document.getElementById('log-load-progress').style.display = 'none';
            });
        })();
    </script>
