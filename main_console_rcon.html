<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <title>YaoGaoChaoLe_MiniGameServer</title>
    <style>
        /* ===== 全局重置 & 布局 ===== */
        * {
            box-sizing: border-box;
            font-family: '微软雅黑', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 10px;
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
        }

        /* ===== 顶部状态栏 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
            gap: 12px;
            flex-wrap: wrap;
            min-height: 48px;
            border: 1px solid #2c2c2c;
        }

        .status-text {
            font-size: 14px;
            color: #0fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 120px;
        }

        .auto-scroll-check,
        .auto-wrap-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            white-space: nowrap;
            color: #ccc;
        }

        .auto-scroll-check input,
        .auto-wrap-check input {
            accent-color: #00ffcc;
        }

        /* ===== 标签栏 ===== */
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            background: #1a1a1a;
            padding: 5px 5px 0 5px;
            border-radius: 6px 6px 0 0;
        }

        .tab-button {
            padding: 8px 16px;
            background: #2c2c2c;
            border: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            color: #ddd;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }

        .tab-button:hover {
            background: #3a3a3a;
            color: #fff;
        }

        .tab-button.active {
            background: #0f0f0f;
            border-bottom-color: #0fc;
            font-weight: 600;
            color: #0fc;
        }

        /* ===== 面板容器 ===== */
        .panel-container {
            flex: 1;
            background: #0f0f0f;
            border-radius: 0 6px 6px 6px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2c2c2c;
            border-top: none;
        }

        .tab-content {
            flex: 1;
            display: none;
            background: #0f0f0f;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
        }

        /* ===== 控制台相关 ===== */
        .console-log-container {
            flex: 1;
            background: #1a1a1a;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            padding: 8px;
            overflow: auto;
        }

        .console-log-line {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .log-textarea {
            flex: 1;
            width: 100%;
            border: none;
            background: #1a1a1a;
            color: #e0e0e0;
            resize: none;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            outline: 0;
            padding: 8px;
            min-height: 0;
        }

        .split-panel {
            display: flex;
            gap: 10px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .split-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            min-height: 0;
            border: 1px solid #2c2c2c;
        }

        /* ===== 通用子标题 ===== */
        .console-log-area .sub-header,
        .ip-query-area .sub-header,
        .ip-record-area .sub-header,
        .split-half .sub-header,
        .stats-area .sub-header {
            padding: 5px 10px;
            background: #252525;
            font-weight: 600;
            border-bottom: 1px solid #3a3a3a;
            flex-shrink: 0;
            color: #0fc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ===== IP 记录面板 ===== */
        .player-ip-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .ip-record-area {
            flex: 2;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2c2c2c;
        }

        .ip-record-area .sub-header {
            flex-shrink: 0;
        }

        .collapse-all-btn {
            padding: 4px 12px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: .2s;
        }

        .collapse-all-btn:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .ip-panel {
            flex: 1;
            overflow: auto;
            padding: 8px;
        }

        .ip-card {
            margin-bottom: 8px;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            background: #0f0f0f;
        }

        .ip-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            background: #1a1a1a;
            border-bottom: 1px solid #2c2c2c;
            user-select: none;
        }

        .ip-header:hover {
            background: #252525;
        }

        .ip-header .toggle-icon {
            font-size: 16px;
            margin-right: 8px;
            color: #fff;
        }

        .ip-header .ip-address {
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 12px;
        }

        .ip-header .ip-address.single-player {
            color: #fff;
        }

        .ip-header .ip-address.multi-player {
            color: #ff0;
        }

        .ip-header .ip-address:hover {
            color: #fff;
        }

        .ip-header .stats {
            color: #aaa;
            font-size: 13px;
            word-break: break-all;
            white-space: normal;
            flex: 1;
        }

        .ip-details {
            padding: 8px 12px;
            display: none;
        }

        .ip-details.expanded {
            display: block;
        }

        .login-record-row {
            font-family: monospace;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px dashed #2c2c2c;
            display: flex;
        }

        .login-record-time {
            color: #0fc;
            width: 80px;
            flex-shrink: 0;
        }

        .login-record-player {
            color: #fff;
            margin-left: 12px;
        }

        /* ===== IP 查询区 ===== */
        .console-log-area,
        .ip-query-area {
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2c2c2c;
        }

        .ip-query-area {
            flex: 1;
            min-height: 180px;
        }

        .console-log-area {
            flex: 3;
            min-height: 0;
        }

        .ip-query-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ip-query-row input {
            flex: 3;
            min-width: 150px;
            padding: 8px 12px;
            border: 1px solid #3a3a3a;
            background: #0f0f0f;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: monospace;
        }

        .ip-query-row input:focus {
            outline: 0;
            border-color: #0fc;
            box-shadow: 0 0 2px #0fc;
        }

        .ip-query-row button {
            flex: 1;
            padding: 8px 16px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: .2s;
        }

        .ip-query-row button:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .ip-query-result {
            flex: 1;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow: auto;
            margin: 0 10px 10px 10px;
            color: #ccc;
        }

        /* ===== 控制台子标题内的控件 ===== */
        .console-log-area .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .line-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-control button,
        .scroll-btn {
            padding: 4px 12px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            transition: .2s;
        }

        .line-control button:hover,
        .scroll-btn:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .scroll-buttons {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        /* ===== 统计面板 ===== */
        .stats-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 1px;
            padding: 1px;
            overflow: auto;
        }

        .stats-chart-area {
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #2c2c2c;
            padding: 12px;
            min-height: 300px;
            overflow: hidden;   /* 防止子元素溢出 */
            position: relative; /* 确保内部定位生效 */
        }

        .stats-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stats-chart-header span {
            color: #0fc;
        }

        .range-selector {
            display: flex;
            gap: 8px;
        }

        .range-btn {
            padding: 4px 12px;
            background: #2c2c2c;
            color: #ccc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
        }

        .range-btn.active {
            background: #0fc;
            color: #0a0a0a;
            border-color: #0fc;
        }

        .range-btn:hover:not(.active) {
            background: #3a3a3a;
            color: #fff;
        }

        .performance-charts-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
        }

        .performance-charts-row .stats-chart-area {
            flex: 1;
            min-width: 280px;
        }

        .performance-chart-container {
            min-height: auto;
        }

        /* ===== 模态框 ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            border: 1px solid #0fc;
            box-shadow: 0 0 10px rgba(0, 255, 204, .2);
        }

        .modal-card h3 {
            color: #0fc;
            margin-top: 0;
        }

        .modal-card input {
            width: 100%;
            padding: 8px;
            margin: 15px 0;
            border: 1px solid #3a3a3a;
            background: #0f0f0f;
            color: #e0e0e0;
            border-radius: 4px;
        }

        .modal-card input:focus {
            outline: 0;
            border-color: #0fc;
        }

        .modal-card button {
            padding: 8px 16px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }

        .modal-card button:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        /* ===== RCON 浮动窗口 ===== */
        .rcon-floating-window {
            position: fixed;
            width: 450px;
            max-width: 85vw;
            height: 400px;
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(255, 255, 255, .5);
            z-index: 10000;
            display: none;
            flex-direction: column;
            resize: both;
            overflow: hidden;
            min-width: 300px;
            min-height: 200px;
            opacity: .9;
        }

        .rcon-floating-window .rcon-header {
            padding: 8px 12px;
            background: #252525;
            font-weight: 600;
            color: #0fc;
            border-bottom: 1px solid #3a3a3a;
            cursor: move;
            user-select: none;
            border-radius: 8px 8px 0 0;
        }

        .rcon-floating-window .rcon-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .rcon-floating-window .command-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .rcon-floating-window .command-input-row input {
            flex: 3;
            padding: 8px 12px;
            border: 1px solid #3a3a3a;
            background: #0f0f0f;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: monospace;
        }

        .rcon-floating-window .command-input-row input:focus {
            outline: 0;
            border-color: #0fc;
            box-shadow: 0 0 2px #0fc;
        }

        .rcon-floating-window .command-input-row button {
            flex: 1;
            padding: 8px 16px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        .rcon-floating-window .command-input-row button:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .rcon-floating-window .result-content {
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow: auto;
            flex: 1;
            color: #ccc;
        }

        /* ===== 沉浸式仪表盘 ===== */
        .immersive-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: none;
            flex-direction: row;
            gap: 2px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 9999;
        }

        body.immersive-mode {
            padding: 0;
            overflow: hidden;
        }

        body.immersive-mode .console-log-area .sub-header,
        body.immersive-mode .panel-container,
        body.immersive-mode .tab-bar,
        body.immersive-mode .top-bar {
            display: none !important;
        }

        body.immersive-mode .rcon-floating-window {
            display: none;
        }

        body.immersive-mode .immersive-dashboard {
            display: flex !important;
        }

        .floating-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10000;
        }

        .floating-btn {
            padding: 5px 5px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: .2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-btn:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .immersive-dashboard .left-panel {
            flex: 7;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            min-height: 0;
        }

        .immersive-dashboard .right-panel {
            flex: 5;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            min-height: 0;
        }

        .immersive-dashboard .left-panel .panel:first-child {
            flex: 2;
        }
        .immersive-dashboard .left-panel .panel:last-child {
            flex: 1;
        }
        .immersive-dashboard .right-panel .panel:first-child {
            flex: 2;
        }
        .immersive-dashboard .right-panel .panel:last-child {
            flex: 1;
        }

        .immersive-dashboard .panel {
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
        }

        .immersive-dashboard .panel-header {
            background: #252525;
            padding: 6px 10px;
            font-weight: 600;
            color: #0fc;
            border-bottom: 1px solid #3a3a3a;
            flex-shrink: 0;
        }

        .immersive-dashboard .panel-content {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #ccc;
        }

        #immersive-stats {
            padding: 0;
            height: 100% !important;
            width: 100%;
            min-height: 200px;
        }

        /* ===== IP 组折叠 ===== */
        .ip-group {
            margin-bottom: 12px;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            background: #0f0f0f;
        }

        .ip-group-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            background: #1a1a1a;
            border-bottom: 1px solid #2c2c2c;
            font-weight: 700;
        }

        .ip-group-header:hover {
            background: #252525;
        }

        .group-toggle-icon {
            font-size: 16px;
            margin-right: 8px;
            color: #fff;
        }

        .group-title {
            color: #fff;
            margin-right: 12px;
        }

        .group-stats {
            color: #aaa;
            font-size: 13px;
        }

        .ip-group-content {
            padding: 8px;
            background: #0f0f0f;
        }

        /* ===== 控制台缩略图 ===== */
        .minimap-window-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 12px;
        }

        .minimap-window-input {
            width: 60px;
            padding: 2px 4px;
            background: #0f0f0f;
            color: #0fc;
            border: 1px solid #2c2c2c;
            border-radius: 3px;
            font-size: 11px;
            font-family: monospace;
            text-align: center;
            opacity: .8;
            transition: opacity .2s, border-color .2s;
        }

        .minimap-window-input:focus,
        .minimap-window-input:hover {
            opacity: 1;
            border-color: #0fc;
            outline: 0;
        }

        .minimap-window-input::-webkit-inner-spin-button {
            opacity: .6;
            height: 16px;
        }

        .console-log-row {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .console-minimap {
            width: 10%;
            min-width: 80px;
            max-width: 200px;
            flex-shrink: 0;
            background: #1a1a1a;
            border-left: 1px solid #2c2c2c;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            box-shadow: inset 2px 0 8px rgba(0, 0, 0, .4);
        }

        .console-minimap:hover {
            filter: brightness(1.05);
        }

        .console-minimap .minimap-viewport {
            position: absolute;
            top: 8px;
            left: 6px;
            right: 6px;
            bottom: auto;
            overflow: hidden;
        }

        .console-minimap .minimap-content {
            transform-origin: top left;
            pointer-events: none;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre;
        }

        .console-minimap .minimap-content .minimap-line {
            display: block;
            line-height: inherit;
            white-space: pre;
        }

        .console-minimap .minimap-indicator {
            position: absolute;
            left: 4px;
            right: 4px;
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .3);
            border-radius: 2px;
            pointer-events: none;
            z-index: 5;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
        }

        .console-minimap:hover .minimap-indicator {
            background: rgba(255, 255, 255, .2);
            border-color: rgba(255, 255, 255, .5);
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0fc;
        }

        textarea {
            scrollbar-width: thin;
        }

        #console-log-container::-webkit-scrollbar {
            width: 12px;

    <!-- ============================================================ -->
    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 全局状态 w
            // ============================================================
            const w = {
                apiPassword: null,
                currentTab: 'console',
                chatLines: [],
                joinQuitLines: [],
                grimLines: [],
                serverLines: [],
                ipLoginRecords: [],
                cmdHistory: [],
                historyIdx: -1,
                highlightRules: [],
                expandedIps: new Set(),
                expandedGroups: new Set(),
                immersiveMode: false,
                autoScrollEnabled: true,
                autoWrapEnabled: false,
                onlineChart: null,
                cpuCharts: [],
                memChart: null,
                netChart: null,
                performanceData: {
                    cpu: [],
                    mem: [],
                    upload: [],
                    download: [],
                    cpuPerCore: []
                },
                currentStatsRange: '1d',
                statsRefreshTimer: null,
                resizeHandlerAttached: false,
                ipLocationCache: new Map(),
                immersiveChart: null,
                immersiveStatsTimer: null,
                anticheatKeywords: [],
                minimapRefreshTimer: null,
                minimapDragging: false,
                minimapStartY: 0,
                minimapHasMoved: false,
                // 新增：缓存的完整数据（用于滑块）
                fullTimes: [],
                fullCounts: [],
                fullMissingRanges: []
            };

            // ============================================================
            // 工具函数 S
            // ============================================================
            const S = {
                escapeHtml: function(text) {
                    return text.replace(/[&<>]/g, function(m) {
                        if (m === '&') return '&amp;';
                        if (m === '<') return '&lt;';
                        if (m === '>') return '&gt;';
                        return m;
                    });
                },

                getHighlightColor: function(line, rules) {
                    for (const rule of rules) {
                        if (line.toLowerCase().includes(rule.keyword.toLowerCase())) {
                            return rule.color;
                        }
                    }
                    return '';
                },

                isContainerAtBottom: function(el) {
                    if (!el) return true;
                    return (el.scrollHeight - el.scrollTop - el.clientHeight) <= 5;
                },

                scrollContainerToBottom: function(el) {
                    if (el) el.scrollTop = el.scrollHeight;
                },

                smoothScrollToBottomDynamic: function(el, duration) {
                    if (!el) return;
                    if (el._scrollAnim) cancelAnimationFrame(el._scrollAnim);
                    var startScroll = el.scrollTop;
                    var startTime = performance.now();
                    var that = this;

                    function animate(time) {
                        var progress = Math.min((time - startTime) / duration, 1);
                        var eased = progress * (2 - progress); // easeOutQuad
                        var targetScroll = el.scrollHeight - el.clientHeight;
                        var newTop = startScroll + (targetScroll - startScroll) * eased;
                        el.scrollTop = Math.min(Math.max(newTop, 0), targetScroll);
                        if (progress < 1) {
                            el._scrollAnim = requestAnimationFrame(animate);
                        } else {
                            el.scrollTop = targetScroll;
                            delete el._scrollAnim;
                            w.autoScrollEnabled = true;
                            var cb = document.getElementById('auto-scroll');
                            if (cb) cb.checked = true;
                        }
                    }
                    el._scrollAnim = requestAnimationFrame(animate);
                },

                smoothScrollToTop: function(el, duration) {
                    if (!el) return;
                    if (el._scrollAnim) cancelAnimationFrame(el._scrollAnim);
                    var startScroll = el.scrollTop;
                    if (startScroll === 0) return;
                    var startTime = performance.now();

                    function animate(time) {
                        var progress = Math.min((time - startTime) / duration, 1);
                        var eased = progress * (2 - progress);
                        el.scrollTop = startScroll * (1 - eased);
                        if (progress < 1) {
                            el._scrollAnim = requestAnimationFrame(animate);
                        } else {
                            delete el._scrollAnim;
                            w.autoScrollEnabled = false;
                            var cb = document.getElementById('auto-scroll');
                            if (cb) cb.checked = false;
                        }
                    }
                    el._scrollAnim = requestAnimationFrame(animate);
                },

                extractProvinceCity: function(location) {
                    if (!location) return { province: '未知', city: '', full: '未知' };
                    var cleaned = location.replace(/^中国\s*/, '');
                    var province = '未知';
                    var provList = [
                        '北京', '天津', '上海', '重庆',
                        '河北', '山西', '辽宁', '吉林', '黑龙江',
                        '江苏', '浙江', '安徽', '福建', '江西', '山东',
                        '河南', '湖北', '湖南', '广东', '海南',
                        '四川', '贵州', '云南', '陕西', '甘肃', '青海',
                        '台湾', '内蒙古', '广西', '西藏', '宁夏', '新疆',
                        '香港', '澳门'
                    ];
                    for (var i = 0; i < provList.length; i++) {
                        if (cleaned.startsWith(provList[i])) {
                            province = provList[i];
                            break;
                        }
                    }
                    return { province: province, city: '', full: cleaned };
                }
            };

            // province mapping (english -> chinese)
            var provMap = {
                'Anhui': '安徽',
                'Beijing': '北京',
                'Chongqing': '重庆',
                'Fujian': '福建',
                'Gansu': '甘肃',
                'Guangdong': '广东',
                'Guangxi': '广西',
                'Guizhou': '贵州',
                'Hainan': '海南',
                'Hebei': '河北',
                'Heilongjiang': '黑龙江',
                'Henan': '河南',
                'Hubei': '湖北',
                'Hunan': '湖南',
                'Inner Mongolia': '内蒙古',
                'Jiangsu': '江苏',
                'Jiangxi': '江西',
                'Jilin': '吉林',
                'Liaoning': '辽宁',
                'Ningxia': '宁夏',
                'Qinghai': '青海',
                'Shaanxi': '陕西',
                'Shandong': '山东',
                'Shanghai': '上海',
                'Shanxi': '山西',
                'Sichuan': '四川',
                'Tianjin': '天津',
                'Tibet': '西藏',
                'Xinjiang': '新疆',
                'Yunnan': '云南',
                'Zhejiang': '浙江',
                'Hong Kong': '香港',
                'Macao': '澳门',
                'Taiwan': '台湾'
            };

            // ============================================================
            // 日志处理器 r
            // ============================================================
            var r = {
                extractPlayerName: function(line) {
                    var match = line.match(/([a-zA-Z0-9_]+)\s*\[\/\d+\.\d+\.\d+\.\d+:\d+\]/);
                    return match ? match[1] : '';
                },

                processLine: function(line) {
                    var raw = line;
                    var isChat = raw.includes('聊') || raw.includes('[Not Secure]') || raw.includes('[Server]') ||
                        raw.includes('[Rcon]') || raw.includes('[TEAM_ONLY]') || raw.includes('[SHOUT]') ||
                        /<[a-zA-Z0-9_]+>/.test(raw);
                    var isJoinQuit = raw.includes('lost connection');
                    var isGrim = w.anticheatKeywords.some(function(kw) { return raw.includes(kw); });
                    var isServer = raw.includes('[Server]');
                    var isLogin = raw.includes('logged in');

                    // 清理前缀
                    raw = raw.replace('[Server thread/INFO]: [Not Secure] ', '');
                    raw = raw.replace('[Server thread/INFO]: ', '');

                    if (isChat) w.chatLines.push(raw);
                    if (isJoinQuit) w.joinQuitLines.push(raw);
                    if (isGrim) w.grimLines.push(raw);
                    if (isServer) w.serverLines.push(raw);

                    if (isLogin) {
                        var timeMatch = raw.match(/\[(\d{2}:\d{2}:\d{2})\]/);
                        var player = this.extractPlayerName(raw);
                        var ipMatch = raw.match(/\/(\d+\.\d+\.\d+\.\d+):\d+\]/);
                        if (timeMatch && player && ipMatch) {
                            w.ipLoginRecords.push({
                                time: timeMatch[1],
                                player: player,
                                ip: ipMatch[1]
                            });
                            if (w.currentTab === 'playerip') {
                                h.scheduleIpPanelRender();
                            }
                        }
                    }

                    h.updateImmersiveDashboard();
                },

                refreshAllDataFromRaw: function(rawText) {
                    w.chatLines = [];
                    w.joinQuitLines = [];
                    w.grimLines = [];
                    w.serverLines = [];
                    w.ipLoginRecords = [];
                    var lines = rawText.split(/\r?\n/);
                    for (var i = 0; i < lines.length; i++) {
                        this.processLine(lines[i]);
                    }
                    if (w.currentTab !== 'console') {
                        h.updateNonConsoleTab();
                    }
                }
            };

            // ============================================================
            // IP 批量查询工具 i
            // ============================================================
            var i = {
                batchQuery: async function(ips, onProgress) {
                    var cache = w.ipLocationCache;
                    var resultMap = new Map();
                    var total = ips.length;
                    var done = 0;

                    // 分批，每批100个
                    var batches = [];
                    for (var idx = 0; idx < ips.length; idx += 100) {
                        batches.push(ips.slice(idx, idx + 100));
                    }

                    for (var b = 0; b < batches.length; b++) {
                        var batch = batches[b];
                        var needQuery = batch.filter(function(ip) { return !cache.has(ip); });

                        if (needQuery.length > 0) {
                            try {
                                var resp = await fetch('http://ip-api.com/batch', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(needQuery)
                                });
                                var data = await resp.json();
                                if (!Array.isArray(data)) throw new Error('批量查询返回格式错误');

                                for (var k = 0; k < needQuery.length; k++) {
                                    var ip = needQuery[k];
                                    var info = data[k];
                                    var locationInfo = { province: '未知', city: '', full: '未知' };
                                    if (info && info.status === 'success') {
                                        var region = info.regionName || '';
                                        if (provMap[region]) region = provMap[region];
                                        var full = info.country + ' ' + region + ' ' + info.city;
                                        var extracted = S.extractProvinceCity(full);
                                        if (extracted.province === '未知' && region) {
                                            extracted.province = region;
                                            extracted.full = info.country + ' ' + region;
                                        } else if (extracted.province !== '未知') {
                                            extracted.full = info.country + ' ' + extracted.province;
                                        }
                                        locationInfo = extracted;
                                    }

                _findFirstVisibleLine: function(lines, scrollTop) {
                    var lo = 0,
                        hi = lines.length - 1;
                    while (lo < hi) {
                        var mid = Math.floor((lo + hi) / 2);
                        if (lines[mid].offsetTop >= scrollTop) {
                            hi = mid;
                        } else {
                            lo = mid + 1;
                        }
                    }
                    return Math.min(lo, lines.length - 1);

                scrollToMouseY: function(y, smooth) {
                    var viewport = this.elements.viewport;
                    if (!viewport) return;
                    var viewportHeight = viewport.clientHeight;
                    var container = h.elements.consoleContainer;
                    if (!container) return;
                    var lines = container.querySelectorAll('.console-log-line');
                    if (lines.length === 0 || this._windowEnd <= this._windowStart) return;

                    var ratio = Math.max(0, Math.min(1, y / viewportHeight));
                    var visibleRange = this._windowEnd - this._windowStart;
                    var targetLineIdx = this._windowStart + Math.floor(ratio * visibleRange);
                    targetLineIdx = Math.max(0, Math.min(targetLineIdx, lines.length - 1));
                    var targetTop = lines[targetLineIdx].offsetTop - 0.3 * container.clientHeight;
                    var maxTop = container.scrollHeight - container.clientHeight;
                    targetTop = Math.max(0, Math.min(targetTop, maxTop));

                    if (smooth) {
                        container.scrollTo({ top: targetTop, behavior: 'smooth' });
                    } else {
                        container.scrollTop = targetTop;
                    }
                },

                refresh: function() {
                    if (!this.elements.panel || !this.elements.content || !this.elements.indicator) return;
                    if (!h.elements.consoleContainer) return;
                    if (this._rafId) return;
                    this._rafId = requestAnimationFrame(function() {
                        d._rafId = null;

                _doRefresh: function() {
                    var container = h.elements.consoleContainer;
                    if (!container) return;
                    var lines = container.querySelectorAll('.console-log-line');
                    this._totalLines = lines.length;
                    if (this._totalLines === 0) {
                        this.elements.content.innerHTML = '';
                        this.updateScaleAndIndicator();
                        return;
                    }

                    var scrollTop = container.scrollTop;
                    var clientH = container.clientHeight;
                    var scrollH = container.scrollHeight;

                    // 找到第一个可见行
                    var firstVisible = this._findFirstVisibleLine(lines, scrollTop);
                    // 估算可见行数
                    var avgLineH = scrollH / this._totalLines;
                    var visibleLines = Math.ceil(clientH / avgLineH);
                    var centerLine = firstVisible + Math.floor(visibleLines / 2);

                    var windowSize = parseInt(this.elements.windowSizeInput ? this.elements.windowSizeInput.value : 1000) || 1000;
                    var start = centerLine - Math.floor(windowSize / 2);
                    if (start < 0) start = 0;
                    var end = start + windowSize;
                    if (end > this._totalLines) {
                        end = this._totalLines;
                        start = Math.max(0, end - windowSize);
                    }
                    this._windowStart = start;
                    this._windowEnd = end;

                    var frag = document.createDocumentFragment();
                    for (var i = start; i < end; i++) {
                        var lineEl = lines[i];
                        var span = document.createElement('span');
                        span.className = 'minimap-line';
                        span.textContent = lineEl.textContent;
                        var color = lineEl.style.color;
                        if (color) span.style.color = color;
                        frag.appendChild(span);
                    }
                    this.elements.content.innerHTML = '';
                    this.elements.content.appendChild(frag);
                    this.updateScaleAndIndicator();
                },

                updateScaleAndIndicator: function() {
                    var viewport = this.elements.viewport;
                    if (!viewport) return;
                    var container = h.elements.consoleContainer;
                    if (!container) return;

                    var viewH = container.clientHeight;
                    viewport.style.bottom = 'auto';
                    viewport.style.height = viewH + 'px';

                    var contentH = this.elements.content.scrollHeight;
                    var viewportH = viewport.clientHeight;
                    if (contentH <= 0 || viewportH <= 0) return;

                    var scale = viewportH / contentH;
                    scale = Math.min(scale, 0.3);
                    this.elements.content.style.transform = 'scale(' + scale + ')';
                    this.updateIndicator();
                },

                updateIndicator: function() {
                    var container = h.elements.consoleContainer;
                    if (!container) return;
                    var viewport = this.elements.viewport;
                    if (!viewport) return;
                    var indicator = this.elements.indicator;
                    var viewH = viewport.clientHeight;
                    var lines = container.querySelectorAll('.console-log-line');
                    if (lines.length === 0 || this._windowEnd <= this._windowStart) {
                        indicator.style.opacity = '0';
                        return;
                    }

                    var scrollTop = container.scrollTop;
                    var clientH = container.clientHeight;
                    var firstLine = lines[this._windowStart];
                    var lastLine = lines[this._windowEnd - 1];
                    var firstTop = firstLine.offsetTop;
                    var lastBottom = lastLine.offsetTop + lastLine.offsetHeight;
                    var totalHeight = lastBottom - firstTop;
                    if (totalHeight <= 0) {
                        indicator.style.opacity = '0';
                        return;
                    }

                    var visibleTop = (scrollTop - firstTop) / totalHeight;
                    var visibleHeight = clientH / totalHeight;
                    visibleTop = Math.max(0, Math.min(visibleTop, 1 - visibleHeight));
                    visibleHeight = Math.min(visibleHeight, 1);
                    var pixelTop = visibleTop * viewH;
                    var pixelHeight = visibleHeight * viewH;
                    pixelHeight = Math.max(pixelHeight, 8);
                    var maxPixel = viewH - pixelHeight;
                    pixelTop = Math.min(Math.max(pixelTop, 0), maxPixel);

                    indicator.style.top = pixelTop + 'px';
                    indicator.style.height = pixelHeight + 'px';
                    indicator.style.opacity = '1';
                }

                initDraggable: function() {
                    var header = document.getElementById('rcon-header');
                    var windowEl = document.getElementById('rcon-floating');
                    if (!header || !windowEl) return;

                    var isDragging = false;
                    var offsetX = 0,
                        offsetY = 0;
                    var startX = 0,
                        startY = 0;

                    function getPos(e) {
                        var ev = e.touches ? e.touches[0] : e;
                        return { clientX: ev.clientX, clientY: ev.clientY };
                    }

                    function onMove(e) {
                        if (!isDragging) return;
                        e.preventDefault();
                        var pos = getPos(e);
                        var dx = pos.clientX - offsetX;
                        var dy = pos.clientY - offsetY;
                        var maxX = window.innerWidth - windowEl.offsetWidth;
                        var maxY = window.innerHeight - windowEl.offsetHeight;
                        dx = Math.min(Math.max(dx, 0), maxX);
                        dy = Math.min(Math.max(dy, 0), maxY);
                        windowEl.style.left = dx + 'px';
                        windowEl.style.top = dy + 'px';
                        windowEl.style.bottom = '';
                        windowEl.style.right = '';
                    }

                    function onUp() {
                        isDragging = false;
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onUp);
                    }

                    function onDown(e) {
                        if (e.button !== undefined && e.button !== 0) return;
                        e.preventDefault();
                        var rect = windowEl.getBoundingClientRect();
                        var pos = getPos(e);
                        offsetX = pos.clientX - rect.left;
                        offsetY = pos.clientY - rect.top;
                        isDragging = true;
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                        document.addEventListener('touchmove', onMove, { passive: false });
                        document.addEventListener('touchend', onUp);
                    }

                    header.addEventListener('mousedown', onDown);
                    header.addEventListener('touchstart', onDown, { passive: false });
                }
            };
