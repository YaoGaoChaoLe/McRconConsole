<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <title>YaoGaoChaoLe_MiniGameServer</title>
    <style>
        * { box-sizing: border-box; font-family: '微软雅黑', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; padding: 10px; background: #0a0a0a; height: 100vh; display: flex; flex-direction: column; color: #e0e0e0; }

        .top-bar { display: flex; align-items: center; justify-content: space-between; background: #1e1e1e; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; box-shadow: 0 2px 4px rgba(0, 0, 0, .5); gap: 12px; flex-wrap: wrap; min-height: 48px; border: 1px solid #2c2c2c; }
        .status-text { font-size: 14px; color: #0fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 120px; }
        .auto-scroll-check, .auto-wrap-check { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; color: #ccc; }
        .auto-scroll-check input, .auto-wrap-check input { accent-color: #00ffcc; }

        #server-select { background: #0f0f0f; color: #0fc; border: 1px solid #3a3a3a; border-radius: 4px; padding: 5px 8px; font-size: 13px; min-width: 110px; cursor: pointer; font-weight: 600; }
        #server-select:focus { outline: none; border-color: #0fc; box-shadow: 0 0 2px #0fc; }

        .tab-bar { display: flex; flex-wrap: wrap; gap: 2px; background: #1a1a1a; padding: 5px 5px 0 5px; border-radius: 6px 6px 0 0; }
        .tab-button { padding: 8px 16px; background: #2c2c2c; border: none; border-radius: 6px 6px 0 0; cursor: pointer; font-size: 14px; transition: .2s; color: #ddd; font-weight: 500; border-bottom: 2px solid transparent; }
        .tab-button:hover { background: #3a3a3a; color: #fff; }
        .tab-button.active { background: #0f0f0f; border-bottom-color: #0fc; font-weight: 600; color: #0fc; }

        .panel-container { flex: 1; background: #0f0f0f; border-radius: 0 6px 6px 6px; box-shadow: 0 2px 4px rgba(0, 0, 0, .5); overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2c2c2c; border-top: none; }
        .tab-content { flex: 1; display: none; background: #0f0f0f; flex-direction: column; overflow: hidden; min-height: 0; }
        .tab-content.active { display: flex; }

        .console-log-line { font-family: inherit; font-size: inherit; line-height: inherit; }
        .log-textarea { flex: 1; width: 100%; border: none; background: #1a1a1a; color: #e0e0e0; resize: none; font-family: Consolas, monospace; font-size: 15px; line-height: 1.5; outline: 0; padding: 8px; min-height: 0; }

        .console-log-area .sub-header, .ip-query-area .sub-header, .ip-record-area .sub-header { padding: 5px 10px; background: #252525; font-weight: 600; border-bottom: 1px solid #3a3a3a; flex-shrink: 0; color: #0fc; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }

        .player-ip-container { display: flex; flex-direction: column; height: 100%; gap: 12px; flex: 1; min-height: 0; }
        .ip-record-area { flex: 2; min-height: 0; display: flex; flex-direction: column; background: #1a1a1a; border-radius: 4px; overflow: hidden; border: 1px solid #2c2c2c; }
        .ip-panel { flex: 1; overflow: auto; padding: 8px; }
        .ip-card { margin-bottom: 8px; border: 1px solid #2c2c2c; border-radius: 4px; background: #0f0f0f; }
        .ip-header { display: flex; align-items: center; padding: 8px 12px; cursor: pointer; background: #1a1a1a; border-bottom: 1px solid #2c2c2c; user-select: none; }
        .ip-header:hover { background: #252525; }
        .ip-header .toggle-icon { font-size: 16px; margin-right: 8px; color: #fff; }
        .ip-header .ip-address { font-weight: 700; cursor: pointer; text-decoration: underline; margin-right: 12px; }
        .ip-header .ip-address.single-player { color: #fff; }
        .ip-header .ip-address.multi-player { color: #ff0; }
        .ip-header .ip-address:hover { color: #fff; }
        .ip-header .stats { color: #aaa; font-size: 13px; word-break: break-all; white-space: normal; flex: 1; }
        .ip-details { padding: 8px 12px; display: none; }
        .ip-details.expanded { display: block; }
        .login-record-row { font-family: monospace; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #2c2c2c; display: flex; }
        .login-record-time { color: #0fc; width: 80px; flex-shrink: 0; }
        .login-record-player { color: #fff; margin-left: 12px; }

        .console-log-area, .ip-query-area { display: flex; flex-direction: column; background: #1a1a1a; border-radius: 4px; overflow: hidden; border: 1px solid #2c2c2c; }
        .ip-query-area { flex: 1; min-height: 180px; }
        .console-log-area { flex: 3; min-height: 0; }
        .ip-query-row { display: flex; gap: 8px; padding: 10px; flex-wrap: wrap; align-items: center; }
        .ip-query-row input { flex: 3; min-width: 150px; padding: 8px 12px; border: 1px solid #3a3a3a; background: #0f0f0f; color: #e0e0e0; border-radius: 4px; font-size: 14px; font-family: monospace; }
        .ip-query-row input:focus { outline: 0; border-color: #0fc; box-shadow: 0 0 2px #0fc; }
        .ip-query-row button { flex: 1; padding: 8px 16px; font-size: 14px; font-weight: 700; }
        .ip-query-result { flex: 1; background: #0f0f0f; border: 1px solid #2c2c2c; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; overflow: auto; margin: 0 10px 10px 10px; color: #ccc; }

        .line-control { display: flex; align-items: center; gap: 8px; }
        .line-control button, .scroll-btn, .ip-query-row button, .config-actions button, .modal-card button, .range-btn, .floating-btn { background: #2c2c2c; color: #0fc; border: 1px solid #3a3a3a; border-radius: 4px; cursor: pointer; }
        .line-control button, .scroll-btn, .ip-query-row button, .floating-btn { transition: .2s; }
        .line-control button:hover, .scroll-btn:hover, .ip-query-row button:hover, .config-actions button:hover, .modal-card button:hover, .range-btn:hover:not(.active), .floating-btn:hover { background: #3a3a3a; color: #fff; }
        .line-control button:hover, .scroll-btn:hover, .ip-query-row button:hover, .modal-card button:hover, .floating-btn:hover { border-color: #0fc; }
        .line-control button, .scroll-btn, .range-btn { padding: 4px 12px; }
        .scroll-buttons { display: flex; gap: 4px; margin-left: auto; }

        .stats-container { display: flex; flex-direction: column; height: 100%; gap: 1px; padding: 1px; overflow: auto; }
        .stats-chart-area { background: #1a1a1a; border-radius: 8px; border: 1px solid #2c2c2c; padding: 12px; min-height: 300px; overflow: hidden; position: relative; }
        .stats-chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .stats-chart-header span { color: #0fc; }
        .range-selector { display: flex; gap: 8px; }
        .range-btn { color: #ccc; }
        .range-btn.active { background: #0fc; color: #0a0a0a; border-color: #0fc; }
        .performance-charts-row { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
        .performance-charts-row .stats-chart-area { flex: 1; min-width: 280px; }
        .performance-chart-container { min-height: auto; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, .8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 300px; text-align: center; border: 1px solid #0fc; box-shadow: 0 0 10px rgba(0, 255, 204, .2); }
        .modal-card h3 { color: #0fc; margin-top: 0; }
        .modal-card input { width: 100%; padding: 8px; margin: 15px 0; border: 1px solid #3a3a3a; background: #0f0f0f; color: #e0e0e0; border-radius: 4px; }
        .modal-card input:focus { outline: 0; border-color: #0fc; }
        .modal-card button { padding: 8px 16px; font-weight: 700; }

        .rcon-floating-window { position: fixed; width: 450px; max-width: 85vw; height: 400px; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 8px; box-shadow: 0 4px 12px rgba(255, 255, 255, .5); z-index: 10000; display: none; flex-direction: column; resize: both; overflow: hidden; min-width: 300px; min-height: 200px; opacity: .9; }
        .rcon-floating-window .rcon-header { padding: 8px 12px; background: #252525; font-weight: 600; color: #0fc; border-bottom: 1px solid #3a3a3a; cursor: move; user-select: none; border-radius: 8px 8px 0 0; }
        .rcon-floating-window .rcon-content { padding: 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
        .rcon-floating-window .command-input-row { display: flex; gap: 8px; align-items: center; }
        .rcon-floating-window .command-input-row input { flex: 3; padding: 8px 12px; border: 1px solid #3a3a3a; background: #0f0f0f; color: #e0e0e0; border-radius: 4px; font-size: 14px; font-family: monospace; }
        .rcon-floating-window .command-input-row input:focus { outline: 0; border-color: #0fc; box-shadow: 0 0 2px #0fc; }
        .rcon-floating-window .command-input-row button { flex: 1; padding: 8px 16px; background: #2c2c2c; color: #0fc; border: 1px solid #3a3a3a; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: 700; }
        .rcon-floating-window .command-input-row button:hover { background: #3a3a3a; color: #fff; border-color: #0fc; }
        .rcon-floating-window .result-content { background: #0f0f0f; border: 1px solid #2c2c2c; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap; overflow: auto; flex: 1; color: #ccc; }

        .immersive-dashboard { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: none; flex-direction: row; gap: 2px; padding: 10px; box-sizing: border-box; z-index: 9999; }
        body.immersive-mode { padding: 0; overflow: hidden; }
        body.immersive-mode .console-log-area .sub-header, body.immersive-mode .panel-container, body.immersive-mode .tab-bar, body.immersive-mode .top-bar { display: none !important; }
        body.immersive-mode .rcon-floating-window { display: none; }
        body.immersive-mode .immersive-dashboard { display: flex !important; }
        .floating-buttons { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 10000; }
        .floating-btn { padding: 5px 5px; font-size: 12px; font-weight: 700; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .immersive-dashboard .left-panel { flex: 7; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 0; }
        .immersive-dashboard .right-panel { flex: 5; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 0; }
        .immersive-dashboard .left-panel .panel:first-child { flex: 2; }
        .immersive-dashboard .left-panel .panel:last-child { flex: 1; }
        .immersive-dashboard .right-panel .panel:first-child { flex: 2; }
        .immersive-dashboard .right-panel .panel:last-child { flex: 1; }
        .immersive-dashboard .panel { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; min-width: 0; }
        .immersive-dashboard .panel-header { background: #252525; padding: 6px 10px; font-weight: 600; color: #0fc; border-bottom: 1px solid #3a3a3a; flex-shrink: 0; }
        .immersive-dashboard .panel-content { flex: 1; min-height: 0; overflow: auto; padding: 8px; font-family: monospace; font-size: 14px; color: #ccc; }
        #immersive-stats { padding: 0; height: 100% !important; width: 100%; min-height: 200px; }

        #monaco-container { width: 100%; height: 100%; border-left: 1px solid #2c2c2c; background: #1a1a1a; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0fc; }
        textarea { scrollbar-width: thin; }

        @media (max-width: 600px) {
            .tab-button { padding: 6px 12px; font-size: 12px; }
            .ip-query-row input { flex: 1; }
        }
        @media (min-width: 501px) {
            .player-ip-container { flex-direction: row; }
            .player-ip-container .ip-record-area { flex: 7.5; }
            .player-ip-container .ip-query-area { flex: 2.5; }
        }

        .grim-split-container { display: flex; flex: 1; min-height: 0; height: 100%; width: 100%; }
        .grim-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
        .grim-left { flex-shrink: 0; width: 50%; }
        .grim-right { flex: 1; }
        .grim-divider { width: 6px; flex-shrink: 0; cursor: col-resize; background: #2c2c2c; position: relative; transition: background .15s ease; user-select: none; -webkit-user-select: none; touch-action: none; }
        .grim-divider::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 2px; height: 32px; background: #666; border-radius: 1px; transition: all .15s ease; }
        .grim-divider.dragging, .grim-divider:hover { background: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, .4); }
        .grim-divider.dragging::before, .grim-divider:hover::before { background: #0a0a0a; height: 44px; }
        @media (max-width: 600px) {
            .grim-split-container { flex-direction: column; }
            .grim-left { width: 100% !important; flex: 1; }
            .grim-right { flex: 1; }
            .grim-divider { display: none; }
        }

        .config-panel { background: #1a1a1a; border-bottom: 1px solid #2c2c2c; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .config-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .config-row label { min-width: 90px; color: #ccc; }
        .config-row input { flex: 1; min-width: 200px; padding: 6px 8px; background: #0f0f0f; color: #e0e0e0; border: 1px solid #3a3a3a; border-radius: 4px; font-family: monospace; }
        .config-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .config-actions button { padding: 6px 14px; font-size: 13px; }
        .config-toggle { cursor: pointer; color: #FFD700; text-decoration: underline; font-size: 13px; }
        .config-toggle:hover { color: #FFA500; }
        .config-hint { font-size: 12px; color: #aaa; margin-left: 98px; }

        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 10, 0.95); z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #0fc; font-size: 18px; font-weight: 600; font-family: '微软雅黑', sans-serif; }
        #loading-overlay .loader { border: 4px solid #2c2c2c; border-top: 4px solid #0fc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://fastly.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.min.css" />
    <script>
        var require = { paths: { vs: 'https://fastly.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } };
    </script>
    <script src="https://fastly.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
</head>

<body>
    <div id="loading-overlay">
        <div class="loader"></div>
        <div>正在加载资源 请确保网络通畅...</div>
    </div>

    <div class="top-bar">
        <select id="server-select" title="选择服务器"></select>
        <div class="status-text" id="status"></div>
        <label class="auto-scroll-check">
            <input id="auto-scroll" type="checkbox" checked> 自动滚动
        </label>
        <label class="auto-wrap-check">
            <input id="auto-wrap" type="checkbox"> 自动换行
        </label>
    </div>

    <div class="tab-bar" id="tab-bar">
        <button class="tab-button" data-tab="stats">统计</button>
        <button class="tab-button" data-tab="console">控制台</button>
        <button class="tab-button" data-tab="chat">聊天记录</button>
        <button class="tab-button" data-tab="grim">反作弊日志</button>
        <button class="tab-button" data-tab="playerip">登录查询</button>
        <button class="tab-button" data-tab="screen">屏幕</button>
        <button class="tab-button" data-tab="joinquit">退出</button>
    </div>

    <div class="panel-container">
        <div class="tab-content" id="tab-console">
            <div class="console-container" style="display:flex;flex-direction:column;height:100%;gap:12px;flex:1;min-height:0;">
                <div class="console-log-area">
                    <div class="sub-header">
                        <span>Latest Log</span>
                        <div class="line-control">
                            <button id="copy-console-btn">复制</button>
                            <div class="scroll-buttons">
                                <button class="scroll-btn" id="scroll-top-btn" title="滚动到顶部">↑</button>
                                <button class="scroll-btn" id="scroll-bottom-btn" title="滚动到底部">↓</button>
                            </div>
                            <div id="log-load-progress" style="font-size:12px;margin-left:auto;color:#aaa;white-space:nowrap;"></div>
                        </div>
                    </div>
                    <div id="monaco-container" style="width: 100%; height: 100%; position: relative;"></div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-chat">
            <div class="console-log-area">
                <div class="sub-header">
                    <span>聊天记录</span>
                    <div class="scroll-buttons">
                        <button class="scroll-btn" id="chat-scroll-top" title="滚动到顶部">↑</button>
                        <button class="scroll-btn" id="chat-scroll-bottom" title="滚动到底部">↓</button>
                    </div>
                </div>
                <textarea class="log-textarea" id="chat-text" readonly wrap="off"></textarea>
            </div>
        </div>

        <div class="tab-content" id="tab-joinquit">
            <div class="console-log-area">
                <div class="sub-header">
                    <span>加入/退出</span>
                    <div class="scroll-buttons">
                        <button class="scroll-btn" id="joinquit-scroll-top" title="滚动到顶部">↑</button>
                        <button class="scroll-btn" id="joinquit-scroll-bottom" title="滚动到底部">↓</button>
                    </div>
                </div>
                <textarea class="log-textarea" id="joinquit-text" readonly wrap="off"></textarea>
            </div>
        </div>

        <div class="tab-content" id="tab-grim">
            <div class="sub-header">
                <span>仅看关键词</span>
                <span class="config-toggle" id="grim-config-toggle">⚙ 配置关键词</span>
            </div>
            <div id="grim-config-panel" class="config-panel" style="display:none;">
                <div class="config-row">
                    <label>关键词1：</label>
                    <input type="text" id="grim-left-keywords" placeholder="多个关键词用半角逗号分隔，如: 触发了, [Server]">
                </div>
                <div class="config-row">
                    <label>关键词2：</label>
                    <input type="text" id="grim-right-keywords" placeholder="多个关键词用半角逗号分隔，如: [Server], moved too quickly">
                </div>
                <div class="config-hint">💡 多个关键词用 半角逗号(英文输入法下的逗号) 分隔。但不要以逗号结尾</div>
                <div class="config-actions">
                    <button id="grim-apply-config">应用</button>
                    <button id="grim-reset-config">重置默认</button>
                    <button id="grim-cancel-config">取消</button>
                </div>
            </div>
            <div class="grim-split-container">
                <div class="grim-panel grim-left" id="grim-left-panel">
                    <div class="sub-header" style="border-radius:0;border-bottom:1px solid #3a3a3a;">包含 关键词1 的日志</div>
                    <textarea class="log-textarea" id="grim-text" readonly wrap="off"></textarea>
                </div>
                <div class="grim-divider" id="grim-divider" title="拖动调整左右宽度"></div>
                <div class="grim-panel grim-right">
                    <div class="sub-header" style="border-radius:0;border-bottom:1px solid #3a3a3a;">包含 关键词2 的日志</div>
                    <textarea class="log-textarea" id="server-text" readonly wrap="off"></textarea>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-playerip">
            <div class="player-ip-container">
                <div class="ip-record-area">
                    <div class="sub-header">
                        <span>玩家登录IP记录</span>
                        <div style="display:flex;gap:8px;">
                            <div class="scroll-buttons">
                                <button class="scroll-btn" id="ip-scroll-top" title="滚动到顶部">↑</button>
                                <button class="scroll-btn" id="ip-scroll-bottom" title="滚动到底部">↓</button>
                            </div>
                        </div>
                    </div>
                    <div class="ip-panel" id="ip-panel"></div>
                </div>
                <div class="ip-query-area">
                    <div class="sub-header">IP归属地查询</div>
                    <div class="ip-query-row">
                        <input id="ip-input" placeholder="输入 IPv4 地址，例如 117.159.10.44">
                        <button id="query-ip-btn">查询</button>
                    </div>
                    <div class="ip-query-result" id="ip-query-result">等待查询</div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-stats">
            <div class="stats-container">
                <div class="stats-chart-area">
                    <div class="stats-chart-header">
                        <span>在线人数趋势</span>
                        <div class="range-selector" id="range-selector">
                            <button class="range-btn active" data-range="1d">1天</button>
                            <button class="range-btn" data-range="3d">3天</button>
                            <button class="range-btn" data-range="7d">7天</button>
                            <button class="range-btn" data-range="15d">15天</button>
                            <button class="range-btn" data-range="30d">30天</button>

                    </div>
                    <div id="online-chart-area" style="position:relative;width:100%;height:320px;">
                        <div id="online-chart" style="width:100%;height:320px;overflow:hidden;"></div>
                        <div id="live-online-summary" style="position:absolute;top:28px;right:0;width:15%;box-sizing:border-box;padding:0 8px;text-align:left;color:#0fc;font-size:12px;line-height:1.7;z-index:5;pointer-events:none;overflow-wrap:anywhere;"></div>
                    </div>

                <div class="performance-charts-row">
                    <div class="stats-chart-area performance-chart-container" style="flex:1;min-width:280px;">
                        <div class="stats-chart-header"><span>系统资源</span></div>
                        <div style="display:flex;flex-direction:column;gap:1px;">
                            <div style="width:100%;">
                                <div style="text-align:center;color:#0fc;font-size:13px;margin-bottom:4px;">网络速率 (Mbps)</div>
                                <div id="net-chart" style="width:100%;height:220px;"></div>
                            </div>
                            <div style="width:100%;">
                                <div style="text-align:center;color:#0fc;font-size:13px;margin-bottom:4px;">内存使用率</div>
                                <div id="mem-chart" style="width:100%;height:180px;"></div>
                            </div>
                        </div>
                    </div>
                    <div class="stats-chart-area performance-chart-container">
                        <div class="stats-chart-header"><span>CPU使用率</span></div>
                        <div id="cpu-charts-container" style="display:flex;flex-wrap:wrap;gap:1px;min-height:1px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-screen">
            <div class="console-log-area">
                <div class="sub-header">
                    <span>屏幕查看</span>
                </div>
                <div style="padding:10px; flex:1; min-height:0; display:flex; flex-direction:column;">
                    <div id="screen-image-container" style="flex:1; min-height:0; display:flex; align-items:center; justify-content:center;">
                        <img id="screen-image" style="width:100%; height:100%; object-fit:contain; border:1px solid #333; display:none;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="immersive-dashboard" id="immersive-dashboard">
        <div class="left-panel">
            <div class="panel">
                <div class="panel-header">控制台日志</div>
                <div class="panel-content" id="immersive-console"></div>
            </div>
            <div class="panel">
                <div class="panel-header">反作弊日志</div>
                <div class="panel-content" id="immersive-grim"></div>
            </div>
        </div>
        <div class="right-panel">
            <div class="panel">
                <div class="panel-header">聊天记录</div>
                <div class="panel-content" id="immersive-chat"></div>
            </div>
            <div class="panel">
                <div class="panel-header">在线玩家</div>
                <div class="panel-content" id="immersive-stats" style="padding:0;"></div>

    <div class="rcon-floating-window" id="rcon-floating">
        <div class="rcon-header" id="rcon-header">RCON 命令</div>
        <div class="rcon-content">
            <div class="command-input-row">
                <input id="rcon-command" placeholder="例如 /list 或 /say Hello" autocomplete="off">
                <button id="send-command-btn">发送命令</button>

            <div class="result-content" id="rcon-result">等待命令执行...</div>

    <div class="floating-buttons">
        <button class="floating-btn" id="rcon-toggle-btn" title="显示/隐藏 RCON 窗口" style="display:none;">R</button>
        <button class="floating-btn" id="immersive-floating-btn" title="沉浸模式" style="display:none;">[+]</button>
    </div>

    <script>
        (function() {
            'use strict';

            const GRIM_DEFAULTS = {
                leftKeywords: ["触发了", "[Server]"],
                rightKeywords: ["[Server]"]
            };

            const w = {
                apiPassword: null,
                currentServer: null,
                serverList: [],
                currentTab: 'console',
                chatLines: [],
                joinQuitLines: [],
                grimLines: [],
                serverLines: [],
                ipLoginRecords: [],
                cmdHistory: [],
                historyIdx: -1,
                highlightRules: [],
                expandedIps: new Set(),
                immersiveMode: false,
                autoScrollEnabled: true,
                autoWrapEnabled: false,
                screenCaptureTimer: null,
                onlineChart: null,
                cpuCharts: [],
                memChart: null,
                netChart: null,
                performanceData: { cpu: [], mem: [], upload: [], download: [], cpuPerCore: [] },
                currentStatsRange: '1d',
                statsRefreshTimer: null,
                resizeHandlerAttached: false,
                immersiveChart: null,
                immersiveStatsTimer: null,
                grimConfig: JSON.parse(JSON.stringify(GRIM_DEFAULTS)),
                rawLogLines: []
            };

            const S = {
                escapeHtml: function(text) {
                    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;' };
                    return text.replace(/[&<>]/g, function(m) { return map[m]; });
                },
                getHighlightColor: function(line, rules) {
                    for (const rule of rules) {
                        if (line.toLowerCase().includes(rule.keyword.toLowerCase())) return rule.color;
                    }
                    return '';
                },
                isContainerAtBottom: function(el) {
                    if (!el) return true;
                    return (el.scrollHeight - el.scrollTop - el.clientHeight) <= 5;
                },
                smoothScrollTo: function(el, duration, toBottom) {
                    if (!el) return;
                    if (el._scrollAnim) cancelAnimationFrame(el._scrollAnim);
                    var startScroll = el.scrollTop;
                    if (!toBottom && startScroll === 0) return;
                    var startTime = performance.now();
                    function animate(time) {
                        var progress = Math.min((time - startTime) / duration, 1);
                        var eased = progress * (2 - progress);
                        var target = toBottom ? el.scrollHeight - el.clientHeight : 0;
                        var newTop = startScroll + (target - startScroll) * eased;
                        el.scrollTop = toBottom ? Math.min(Math.max(newTop, 0), target) : Math.max(newTop, 0);
                        if (progress < 1) el._scrollAnim = requestAnimationFrame(animate);
                        else {
                            el.scrollTop = target;
                            delete el._scrollAnim;
                            w.autoScrollEnabled = toBottom;
                            var cb = document.getElementById('auto-scroll');
                            if (cb) cb.checked = toBottom;
                        }
                    }
                    el._scrollAnim = requestAnimationFrame(animate);
                },
                smoothScrollToBottomDynamic: function(el, duration) { S.smoothScrollTo(el, duration, true); },
                smoothScrollToTop: function(el, duration) { S.smoothScrollTo(el, duration, false); },
                appendMonacoLines: function(editor, lines, autoScroll) {
                    if (!editor || !lines.length) return;
                    var model = editor.getModel();
                    var lastLine = model.getLineCount();
                    model.pushEditOperations([], [{
                        range: new monaco.Range(lastLine, model.getLineMaxColumn(lastLine), lastLine, model.getLineMaxColumn(lastLine)),
                        text: '\n' + lines.join('\n'),
                        forceMoveMarkers: true
                    }]);
                    if (autoScroll) editor.revealLineInCenter(model.getLineCount(), monaco.editor.ScrollType.Smooth);
                },
                apiFetch: function(url, options, token) {
                    options = options || {};
                    options.headers = Object.assign({
                        'Authorization': 'Bearer ' + (token || w.apiPassword)
                    }, options.headers || {});
                    return fetch(url, options);
                },
                bindDrag: function(handle, onStart, onMove, onEnd) {
                    var dragging = false;
                    function getPos(e) {
                        var ev = e.touches ? e.touches[0] : e;
                        return { x: ev.clientX, y: ev.clientY };
                    }
                    function move(e) {
                        if (!dragging) return;
                        e.preventDefault();
                        onMove(getPos(e));
                    }
                    function end() {
                        if (!dragging) return;
                        dragging = false;
                        document.removeEventListener('mousemove', move);
                        document.removeEventListener('mouseup', end);
                        document.removeEventListener('touchmove', move);
                        document.removeEventListener('touchend', end);
                        document.removeEventListener('touchcancel', end);
                        if (onEnd) onEnd();
                    }
                    function start(e) {
                        if (e.button !== undefined && e.button !== 0) return;
                        e.preventDefault();
                        dragging = true;
                        onStart(getPos(e));
                        document.addEventListener('mousemove', move);
                        document.addEventListener('mouseup', end);
                        document.addEventListener('touchmove', move, { passive: false });
                        document.addEventListener('touchend', end);
                        document.addEventListener('touchcancel', end);
                    }
                    handle.addEventListener('mousedown', start);
                    handle.addEventListener('touchstart', start, { passive: false });
                }
            };

            var r = {
                extractPlayerName: function(line) {
                    var match = line.match(/([a-zA-Z0-9_]+)\s*\[\/\d+\.\d+\.\d+\.\d+:\d+\]/);
                    return match ? match[1] : '';
                },
                processLine: function(line) {
                    var raw = line;
                    var isChat = raw.includes('聊') || raw.includes('[Not Secure]') || raw.includes('[Server]') ||
                        raw.includes('[Rcon]') || raw.includes('[TEAM_ONLY]') || raw.includes('[SHOUT]') ||
                        /<[a-zA-Z0-9_]+>/.test(raw);
                    var isJoinQuit = raw.includes('lost connection');
                    var isGrim = w.grimConfig.leftKeywords.some(function(kw) { return raw.includes(kw); });
                    var isServer = w.grimConfig.rightKeywords.some(function(kw) { return raw.includes(kw); });
                    var isLogin = raw.includes('logged in');

                    raw = raw.replace('[Server thread/INFO]: [Not Secure] ', '');
                    raw = raw.replace('[Server thread/INFO]: ', '');

                    if (isChat) w.chatLines.push(raw);
                    if (isJoinQuit) w.joinQuitLines.push(raw);
                    if (isGrim) w.grimLines.push(raw);
                    if (isServer) w.serverLines.push(raw);

                    if (isLogin) {
                        var timeMatch = raw.match(/\[(\d{2}:\d{2}:\d{2})\]/);
                        var player = this.extractPlayerName(raw);
                        var ipMatch = raw.match(/\/(\d+\.\d+\.\d+\.\d+):\d+\]/);
                        if (timeMatch && player && ipMatch) {
                            w.ipLoginRecords.push({ time: timeMatch[1], player: player, ip: ipMatch[1] });
                            if (w.currentTab === 'playerip') h.scheduleIpPanelRender();
                        }
                    }

                    h.updateImmersiveDashboard();
                },
                refreshAllDataFromRaw: function(rawText) {
                    w.chatLines = [];
                    w.joinQuitLines = [];
                    w.grimLines = [];
                    w.serverLines = [];
                    w.ipLoginRecords = [];
                    var lines = rawText.split(/\r?\n/);
                    w.rawLogLines = lines;
                    for (var i = 0; i < lines.length; i++) this.processLine(lines[i]);
                    if (w.currentTab !== 'console') h.updateNonConsoleTab();
                }
            };

            var h = {
                elements: {},
                ipPanelRenderTimer: null,

                init: function() {
                    this.elements = {};
                    var elementMap = {
                        status: 'status', autoScroll: 'auto-scroll', autoWrap: 'auto-wrap',
                        chatText: 'chat-text', joinquitText: 'joinquit-text', grimText: 'grim-text', serverText: 'server-text',
                        ipPanel: 'ip-panel', ipInput: 'ip-input', ipResult: 'ip-query-result',
                        rconCommand: 'rcon-command', rconResult: 'rcon-result',
                        immersiveBtn: 'immersive-floating-btn', rconToggleBtn: 'rcon-toggle-btn', rconWindow: 'rcon-floating',
                        immersiveConsole: 'immersive-console', immersiveChat: 'immersive-chat',
                        immersiveGrim: 'immersive-grim', immersiveStats: 'immersive-stats',
                        progressDiv: 'log-load-progress', grimConfigToggle: 'grim-config-toggle'
                    };
                    for (var key in elementMap) this.elements[key] = document.getElementById(elementMap[key]);
                    this.bindEvents();
                    this.initDraggable();
                    this.initMonaco();

                    var self = this;
                    ['chatText', 'joinquitText', 'grimText', 'serverText', 'ipPanel'].forEach(function(id) {
                        var el = self.elements[id];
                        if (el) el.addEventListener('scroll', function() { self.updateAutoScrollCheck(); });
                    });
                },

                initMonaco: function() {
                    var self = this;
                    var overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.style.display = 'flex';

                    require(['vs/editor/editor.main'], function() {
                        var container = document.getElementById('monaco-container');
                        if (!container) return;

                        var style = document.createElement('style');
                        style.innerHTML = w.highlightRules.map(function(rule) {
                            return '.color-' + rule.color.replace('#', '') + ' { color: ' + rule.color + ' !important; }';
                        }).join('');
                        document.head.appendChild(style);

                        self.monacoModel = monaco.editor.createModel('', 'plaintext');
                        self.monacoEditor = monaco.editor.create(container, {
                            model: self.monacoModel,
                            theme: 'vs-dark',
                            minimap: { enabled: true, renderCharacters: false },
                            wordWrap: w.autoWrapEnabled ? 'on' : 'off',
                            scrollBeyondLastLine: false,
                            automaticLayout: true,
                            readOnly: true,
                            lineNumbers: true,
                            fontSize: 14,
                            lineHeight: 20
                        });

                        self.monacoEditor.onDidScrollChange(function() { self.updateAutoScrollCheck(); });

                        if (overlay) overlay.style.display = 'none';
                    }, function(err) {
                        console.error('Monaco CDN 加载失败:', err);
                        if (overlay) overlay.innerHTML = '<div style="color: #ff4343; text-align: center;">加载 Monaco 引擎失败！<br>请检查网络连接后刷新页面。</div>';
                    });
                },

                updateDecorations: function() {
                    if (!this.monacoEditor) return;
                    var model = this.monacoEditor.getModel();
                    var rules = w.highlightRules;
                    var newDecorations = [];
                    var allLines = model.getLinesContent();
                    var ruleRegex = rules.map(function(rule) {
                        return {
                            regex: new RegExp(rule.keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'),
                            color: rule.color
                        };
                    });

                    for (var lineIdx = 0; lineIdx < allLines.length; lineIdx++) {
                        var lineText = allLines[lineIdx];
                        for (var i = 0; i < ruleRegex.length; i++) {
                            if (ruleRegex[i].regex.test(lineText)) {
                                newDecorations.push({
                                    range: new monaco.Range(lineIdx + 1, 1, lineIdx + 1, 1),
                                    options: {
                                        isWholeLine: true,
                                        inlineClassName: 'color-' + ruleRegex[i].color.replace('#', '')
                                    }
                                });
                                break;
                            }
                        }
                    }
                    if (this.monacoDecorations) this.monacoDecorations.clear();
                    this.monacoDecorations = this.monacoEditor.createDecorationsCollection(newDecorations);
                },
                bindEvents: function() {
                    var self = this;
                    var byId = function(id) { return document.getElementById(id); };
                    var el = this.elements;

                    el.autoScroll.addEventListener('change', function() { self.onAutoScrollChange(); });
                    el.autoWrap.addEventListener('change', function() { self.setAllWrapMode(el.autoWrap.checked); });

                    byId('scroll-top-btn').addEventListener('click', function() {
                        if (self.monacoEditor) self.monacoEditor.revealLine(1);
                    });
                    byId('scroll-bottom-btn').addEventListener('click', function() {
                        if (self.monacoEditor) self.monacoEditor.revealLineInCenter(self.monacoEditor.getModel().getLineCount(), monaco.editor.ScrollType.Smooth);
                    });
                    byId('copy-console-btn').addEventListener('click', function() { self.copyConsoleContent(); });

                    byId('send-command-btn').addEventListener('click', function() { t.sendCommand(); });
                    el.rconCommand.addEventListener('keypress', function(e) { if (e.key === 'Enter') t.sendCommand(); });
                    el.rconCommand.addEventListener('keydown', function(e) { t.onKeydown(e); });

                    byId('query-ip-btn').addEventListener('click', function() { self.queryIP(el.ipInput.value); });
                    el.ipInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') self.queryIP(el.ipInput.value); });
                    el.ipPanel.addEventListener('click', function(e) { self.handleIpPanelClick(e); });

                    el.immersiveBtn.addEventListener('click', function() { self.toggleImmersiveMode(); });
                    el.rconToggleBtn.addEventListener('click', function() { self.toggleRconWindow(); });

                    [
                        ['chat-scroll-top', el.chatText, 'top'], ['chat-scroll-bottom', el.chatText, 'bottom'],
                        ['joinquit-scroll-top', el.joinquitText, 'top'], ['joinquit-scroll-bottom', el.joinquitText, 'bottom'],
                        ['ip-scroll-top', el.ipPanel, 'top'], ['ip-scroll-bottom', el.ipPanel, 'bottom']
                    ].forEach(function(item) {
                        var btn = byId(item[0]);
                        if (btn) btn.addEventListener('click', function() {
                            if (item[2] === 'top') S.smoothScrollToTop(item[1], 200);
                            else S.smoothScrollToBottomDynamic(item[1], 200);
                        });
                    });

                    el.grimConfigToggle.addEventListener('click', function() {
                        var panel = byId('grim-config-panel');
                        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
                    });
                    byId('grim-apply-config').addEventListener('click', function() { self.applyAnticheatConfig(); });
                    byId('grim-reset-config').addEventListener('click', function() { self.resetAnticheatConfig(); });
                    byId('grim-cancel-config').addEventListener('click', function() {
                        byId('grim-config-panel').style.display = 'none';
                        self.fillGrimInputs();
                    });
                },

                fillGrimInputs: function() {
                    document.getElementById('grim-left-keywords').value = w.grimConfig.leftKeywords.join(',');
                    document.getElementById('grim-right-keywords').value = w.grimConfig.rightKeywords.join(',');
                },

                applyAnticheatConfig: function() {
                    var leftRaw = document.getElementById('grim-left-keywords').value.trim();
                    var rightRaw = document.getElementById('grim-right-keywords').value.trim();
                    w.grimConfig.leftKeywords = leftRaw.split(',').map(k => k.trim()).filter(k => k.length > 0);
                    w.grimConfig.rightKeywords = rightRaw.split(',').map(k => k.trim()).filter(k => k.length > 0);
                    this.reclassifyAnticheatLines();
                    document.getElementById('grim-config-panel').style.display = 'none';
                    this.showStatus('反作弊关键词已更新', 2000);
                },

                resetAnticheatConfig: function() {
                    w.grimConfig = JSON.parse(JSON.stringify(GRIM_DEFAULTS));
                    this.fillGrimInputs();
                    this.reclassifyAnticheatLines();
                    this.showStatus('已重置为默认关键词', 2000);
                },

                reclassifyAnticheatLines: function() {
                    var leftKeys = w.grimConfig.leftKeywords;
                    var rightKeys = w.grimConfig.rightKeywords;
                    var newGrim = [], newServer = [];
                    var rawLines = w.rawLogLines || [];
                    var BATCH = 5000;
                    var index = 0;
                    var self = this;
                    var statusEl = this.elements.status;
                    var progressEl = document.getElementById('log-load-progress');
                    progressEl.style.display = 'block';
                    var total = rawLines.length;

                    function processBatch() {
                        var end = Math.min(index + BATCH, total);
                        for (var i = index; i < end; i++) {
                            var line = rawLines[i];
                            var cleaned = line.replace('[Server thread/INFO]: [Not Secure] ', '').replace('[Server thread/INFO]: ', '');
                            if (leftKeys.some(kw => line.toLowerCase().includes(kw.toLowerCase()))) newGrim.push(cleaned);
                            if (rightKeys.some(kw => line.toLowerCase().includes(kw.toLowerCase()))) newServer.push(cleaned);
                        }
                        index = end;
                        var pct = Math.round((index / total) * 100);
                        statusEl.innerText = '正在重新分类反作弊日志... ' + index + '/' + total + ' (' + pct + '%)';
                        progressEl.innerText = ' 🔄 重新过滤 ' + index + '/' + total + ' (' + pct + '%)';

                        if (index < total) requestAnimationFrame(processBatch);
                        else {
                            w.grimLines = newGrim;
                            w.serverLines = newServer;
                            self.updateNonConsoleTab();
                            progressEl.style.display = 'none';
                            statusEl.innerText = total + ' 行日志已加载';
                            if (w.currentTab === 'grim' && w.autoScrollEnabled) {
                                S.smoothScrollToBottomDynamic(self.elements.grimText, 200);
                                S.smoothScrollToBottomDynamic(self.elements.serverText, 200);
                            }
                        }
                    }
                    requestAnimationFrame(processBatch);
                },

                setAllWrapMode: function(enabled) {
                    var mode = enabled ? 'pre-wrap' : 'pre';
                    var wordBreak = enabled ? 'break-word' : 'normal';
                    function apply(el) {
                        if (!el) return;
                        el.style.whiteSpace = mode;
                        el.style.wordWrap = wordBreak;
                        if (el.tagName !== 'TEXTAREA') {
                            Array.from(el.querySelectorAll('.console-log-line')).forEach(function(line) {
                                line.style.whiteSpace = mode;
                                line.style.wordWrap = wordBreak;
                            });
                        }
                    }
                    var self = this;
                    ['chatText', 'joinquitText', 'grimText', 'serverText'].forEach(function(k) { apply(self.elements[k]); });
                    if (this.monacoEditor) this.monacoEditor.updateOptions({ wordWrap: enabled ? 'on' : 'off' });
                    w.autoWrapEnabled = enabled;
                },

                onAutoScrollChange: function() {
                    w.autoScrollEnabled = this.elements.autoScroll.checked;
                    if (!w.autoScrollEnabled) return;
                    if (w.currentTab === 'console') {
                        if (this.monacoEditor) this.monacoEditor.revealLineInCenter(this.monacoEditor.getModel().getLineCount(), monaco.editor.ScrollType.Smooth);
                        return;
                    }
                    var el = this.elements;
                    var map = { chat: [el.chatText], joinquit: [el.joinquitText], grim: [el.grimText, el.serverText], playerip: [el.ipPanel] };
                    (map[w.currentTab] || []).forEach(function(e) { S.smoothScrollToBottomDynamic(e, 200); });
                },

                updateAutoScrollCheck: function() {
                    var self = this;
                    clearTimeout(this._scrollCheckTimer);
                    this._scrollCheckTimer = setTimeout(function() {
                        var m = self.monacoEditor;
                        var allAtBottom = !m || (m.getScrollHeight() - m.getScrollTop() - m.getLayoutInfo().height) <= 5;
                        var el = self.elements;
                        [el.chatText, el.joinquitText, el.grimText, el.serverText, el.ipPanel].some(function(e) {
                            if (e && !S.isContainerAtBottom(e)) { allAtBottom = false; return true; }
                        });
                        if (el.autoScroll.checked !== allAtBottom) {
                            el.autoScroll.checked = allAtBottom;
                            w.autoScrollEnabled = allAtBottom;
                        }
                    }, 100);
                },

                appendLogLines: function(lines) {
                    if (!this.monacoEditor || !lines.length) return;
                    S.appendMonacoLines(this.monacoEditor, lines, w.autoScrollEnabled);
                    this.updateDecorations();
                },

                updateNonConsoleTab: function() {
                    var tab = w.currentTab;
                    if (tab === 'console') return;
                    if (tab === 'playerip') {
                        this.renderIpPanel();
                        return;
                    }
                    var el = this.elements;
                    var sortByTime = function(lines) {
                        return lines.slice().sort(function(a, b) {
                            var t1 = (a.match(/\[(\d{2}:\d{2}:\d{2})\]/) || [])[1] || '';
                            var t2 = (b.match(/\[(\d{2}:\d{2}:\d{2})\]/) || [])[1] || '';
                            return t1.localeCompare(t2);
                        });
                    };
                    var plan = {
                        chat: [{ el: el.chatText, lines: w.chatLines }],
                        joinquit: [{ el: el.joinquitText, lines: sortByTime(w.joinQuitLines) }],
                        grim: [{ el: el.grimText, lines: w.grimLines }, { el: el.serverText, lines: w.serverLines }]
                    }[tab];
                    if (!plan) return;
                    for (var i = 0; i < plan.length; i++) {
                        this.updateTextareaWithSelection(plan[i].el, plan[i].lines.join('\n'));
                        if (w.autoScrollEnabled) S.smoothScrollToBottomDynamic(plan[i].el, 200);
                    }
                    this.updateImmersiveDashboard();
                },

                updateTextareaWithSelection: function(textarea, value) {
                    if (!textarea) return;
                    var selStart = textarea.selectionStart;
                    var selEnd = textarea.selectionEnd;
                    textarea.value = value;
                    if (selStart !== undefined && selEnd !== undefined && value.length >= selEnd) {
                        textarea.selectionStart = selStart;

                                }
                            }],
                            grid: { top: 28, left: '9%', right: '15%', containLabel: true }
                        };

                        if (hasZoom) {
                            option.dataZoom = [{
                                type: 'slider', start: startVal, end: endVal, zoomLock: true,
                                showDetail: true, bottom: 30, height: 20,
                                borderColor: '#2c2c2c', fillerColor: 'rgba(0,255,204,0.2)',
                                handleStyle: { color: '#00ffcc' }, textStyle: { color: '#ccc' }
                            }];
                        }

                        var chart = immersive ? w.immersiveChart : w.onlineChart;
                        if (!chart) {
                            chart = echarts.init(immersive ? h.elements.immersiveStats : document.getElementById('online-chart'));
                            if (immersive) w.immersiveChart = chart;
                            else {
                                w.onlineChart = chart;
                                if (!w.resizeHandlerAttached) {
                                    window.addEventListener('resize', function() {
                                        if (w.onlineChart) w.onlineChart.resize();
                                        o.resizeAllCharts();
                                    });
                                    w.resizeHandlerAttached = true;
                                }
                            }
                        }
                        chart.setOption(option, true);
                        if (immersive) setTimeout(function() { chart.resize(); }, 50);
                        else chart.resize();

                        if (hasZoom) {
                            var targetWidthCopy = targetWidth;
                            chart.off('datazoom');
                            chart.on('datazoom', function(params) {
                                var currentWidth = params.end - params.start;
                                if (Math.abs(currentWidth - targetWidthCopy) > 0.5) {
                                    var newStart = Math.max(0, 100 - targetWidthCopy);
                                    chart.setOption({ dataZoom: [{ start: newStart, end: 100 }] });
                                }
                            });
                        }

                        document.querySelectorAll('#range-selector .range-btn').forEach(btn => btn.classList.remove('active'));
                        var activeBtn = document.querySelector('#range-selector .range-btn[data-range="' + effectiveRange + '"]');
                        if (activeBtn) activeBtn.classList.add('active');
                        w.currentStatsRange = effectiveRange;
                    } catch (err) { console.error('加载统计数据失败:', err); }
                },

                loadOnlineDetail: async function() {
                    var el = document.getElementById('live-online-summary');
                    if (!el) return;
                    try {
                        var resp = await S.apiFetch('/api/online/detail');
                        var data = await resp.json();
                        if (!data.success || !data.data) { el.textContent = ''; return; }
                        var d = data.data;
                        var totalText = (d.total === null || d.total === undefined) ? '--' : d.total;
                        el.innerHTML = '<div style="color:#ff0;">当前总在线: ' + totalText + ' 人</div>' +
                            (d.servers || []).map(function(sv) {
                                var onlineText = (sv.online === null || sv.online === undefined) ? '--' : sv.online;
                                return '<div style="color:#fff;">- ' + S.escapeHtml(sv.address) + ': ' + onlineText + ' 人</div>';
                            }).join('');
                    } catch (err) { el.textContent = ''; }
                },

                resizeAllCharts: function() {
                    w.cpuCharts.forEach(function(c) { c.resize(); });
                    [w.memChart, w.netChart, w.onlineChart, w.immersiveChart].forEach(function(c) { if (c) c.resize(); });
                },

                initPerformanceCharts: function() {
                    var self = this;
                    function ensureChart(id, refName, option) {
                        var el = document.getElementById(id);
                        if (el && el.offsetHeight > 0 && !w[refName]) {
                            w[refName] = echarts.init(el);
                            w[refName].setOption(option);
                        }
                    }
                    ensureChart('mem-chart', 'memChart', {
                        tooltip: { trigger: 'axis' },
                        grid: { top: 28, bottom: 3, left: '1%', right: '5%', containLabel: true },
                        xAxis: { type: 'category', data: [], axisLabel: { interval: 5, rotate: 30, fontSize: 9, margin: 8 } },
                        yAxis: { type: 'value', name: '%', min: 0, max: 100 },
                        series: [{ type: 'line', data: [], smooth: false, color: '#2196f3', lineStyle: { color: '#2196f3' }, areaStyle: { opacity: 0.2, color: '#2196f3' } }]
                    });
                    ensureChart('net-chart', 'netChart', {
                        tooltip: { trigger: 'axis' },
                        grid: { top: 28, bottom: 3, left: '1%', right: '5%', containLabel: true },
                        xAxis: { type: 'category', data: [], axisLabel: { interval: 5, rotate: 30, fontSize: 9, margin: 8 } },
                        yAxis: { type: 'value', name: 'Mbps' },
                        series: [
                            { name: '上传', type: 'line', data: [], color: '#ff9800', lineStyle: { color: '#ff9800' }, areaStyle: { opacity: 0.2, color: '#ff9800' } },
                            { name: '下载', type: 'line', data: [], color: '#4caf50', lineStyle: { color: '#4caf50' }, areaStyle: { opacity: 0.2, color: '#4caf50' } }
                        ]
                    });
                    if (!w.memChart || !w.netChart) setTimeout(function() { self.initPerformanceCharts(); }, 100);
                    this.resizeAllCharts();
                },

                startAutoRefresh: function() {
                    if (w.statsRefreshTimer) clearInterval(w.statsRefreshTimer);
                    var self = this;
                    w.statsRefreshTimer = setInterval(function() {
                        if (w.currentTab === 'stats') {
                            self.loadOnlineStats(w.currentStatsRange);
                            self.loadOnlineDetail();
                        }
                    }, 60000);
                },

                stopAutoRefresh: function() {
                    if (w.statsRefreshTimer) { clearInterval(w.statsRefreshTimer); w.statsRefreshTimer = null; }
                }
            };

            var s = {
                enabled: false,
                totalLines: 0,
                loadedUpTo: 0,
                loading: false,
                stopFlag: false,
                progressDiv: null,

                start: async function() {
                    if (this.enabled) return;
                    this.enabled = true;
                    this.stopFlag = false;
                    window._historyLoadStarted = true;
                    this.progressDiv = h.elements.progressDiv;
                    await this.resetAndClear();
                    if (!this.stopFlag && this.loadedUpTo < this.totalLines) this.loadNextChunk();
                },

                resetAndClear: async function() {
                    this.loadedUpTo = 0;
                    if (h.monacoEditor) {
                        h.monacoEditor.setValue('');
                        if (h.monacoDecorations) h.monacoDecorations.clear();
                    }
                    this.updateProgress(0, 0);
                    try {
                        var resp = await S.apiFetch('/api/log/total_lines?server=' + encodeURIComponent(w.currentServer));
                        var data = await resp.json();
                        this.totalLines = data.total;
                        this.updateProgress(0, this.totalLines);
                    } catch (err) {
                        console.error('获取总行数失败', err);
                        this.totalLines = 0;
                        this.enabled = false;
                        if (this.progressDiv) this.progressDiv.textContent = ' 加载失败';
                    }
                },

                loadNextChunk: function() {
                    if (this.stopFlag || !this.enabled || this.loading) return;
                    if (this.loadedUpTo >= this.totalLines) {
                        this.updateProgress(this.totalLines, this.totalLines);
                        this.enabled = false;
                        return;
                    }
                    this.loading = true;
                    var start = this.loadedUpTo;
                    var count = Math.min(5000, this.totalLines - start);
                    var self = this;
                    S.apiFetch('/api/log/range?server=' + encodeURIComponent(w.currentServer) + '&start=' + start + '&count=' + count)
                    .then(resp => resp.json()).then(function(data) {
                        if (data.lines && data.lines.length) {
                            if (h.monacoEditor) {
                                S.appendMonacoLines(h.monacoEditor, data.lines, w.autoScrollEnabled);
                                h.updateDecorations();
                            }
                            self.loadedUpTo += data.lines.length;
                            self.updateProgress(self.loadedUpTo, self.totalLines);
                        }
                        self.loading = false;
                        if (!self.stopFlag && self.loadedUpTo < self.totalLines) self.loadNextChunk();
                        else { self.updateProgress(self.totalLines, self.totalLines); self.enabled = false; }
                    }).catch(function(err) {
                        console.error('加载日志块失败', err);
                        self.enabled = false;
                        if (self.progressDiv) self.progressDiv.textContent = ' ⚠ 加载失败';
                        self.loading = false;
                    });
                },

                updateProgress: function(loaded, total) {
                    if (!this.progressDiv) return;
                    if (total === 0) { this.progressDiv.textContent = ' 计算行数...'; this.progressDiv.style.display = ''; return; }
                    if (loaded >= total) this.progressDiv.style.display = 'none';
                    else {
                        this.progressDiv.style.display = '';
                        var pct = ((loaded / total) * 100).toFixed(1);
                        this.progressDiv.textContent = ' 📄 加载日志 ' + loaded + '/' + total + ' (' + pct + '%)';
                    }
                }
            };

            async function l(tab) {
                w.currentTab = tab;
                document.querySelectorAll('.tab-button').forEach(function(btn) {
                    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
                });
                document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
                document.getElementById('tab-' + tab).classList.add('active');

                if (tab === 'console') {
                    if (h.monacoEditor) h.monacoEditor.layout();
                    o.stopAutoRefresh();
                    w.autoScrollEnabled = true;
                    if (h.elements.autoScroll) h.elements.autoScroll.checked = true;
                    if (h.monacoEditor) {
                        var lineCount = h.monacoEditor.getModel().getLineCount();
                        if (lineCount > 0) h.monacoEditor.revealLineInCenter(lineCount, monaco.editor.ScrollType.Smooth);
                    }
                } else if (tab === 'stats') {
                    var activeBtn = document.querySelector('#range-selector .range-btn.active');
                    var range = activeBtn ? activeBtn.getAttribute('data-range') : '7d';
                    w.currentStatsRange = range;
                    await o.loadOnlineStats(range);
                    o.loadOnlineDetail();
                    o.initPerformanceCharts();
                    if (w.onlineChart) setTimeout(function() { w.onlineChart.resize(); }, 100);
                    o.startAutoRefresh();
                } else {
                    h.stopScreenCapture();
                    o.stopAutoRefresh();
                    if (tab === 'screen') h.startScreenCapture();
                    else h.updateNonConsoleTab();
                }
            }

            function resetClientState() {
                w.chatLines = []; w.joinQuitLines = []; w.grimLines = []; w.serverLines = [];
                w.ipLoginRecords = []; w.rawLogLines = []; w.expandedIps = new Set();
                ['chatText', 'joinquitText', 'grimText', 'serverText'].forEach(function(k) {
                    if (h.elements[k]) h.elements[k].value = '';
                });
                if (h.elements.ipPanel) h.elements.ipPanel.innerHTML = '';
                s.stopFlag = true;
                s.enabled = false;
                s.loading = false;
            }

            async function loadServerData(serverName, token) {
                var rawResp = await S.apiFetch('/api/latest_raw?server=' + encodeURIComponent(serverName), {}, token);
                var rawText = await rawResp.text();
                r.refreshAllDataFromRaw(rawText);
                s.start();
                if (w.currentTab === 'stats') {
                    await o.loadOnlineStats(w.currentStatsRange);
                    o.loadOnlineDetail();
                } else if (w.currentTab !== 'console') {
                    h.updateNonConsoleTab();
                }
            }

            // 切换服务器
            async function switchServer(newServer) {
                if (!newServer || newServer === w.currentServer) return;
                w.currentServer = newServer;
                resetClientState();
                h.showStatus('正在切换至 ' + newServer + ' ...', 2000);
                try {
                    await loadServerData(newServer);
                    h.showStatus('已切换至 ' + newServer, 2000);
                } catch (err) {
                    console.error('切换服务器失败', err);
                    h.showStatus('切换失败', 3000);
                }
            }

            function promptPassword() {
                return new Promise(function(resolve) {
                    var modal = document.createElement('div');
                    modal.className = 'modal';
                    modal.innerHTML = '<div class="modal-card"><h3>请输入访问密码</h3><input type="password" id="pwd-input" placeholder="密码"><button id="pwd-submit">确认</button></div>';
                    document.body.appendChild(modal);
                    var input = modal.querySelector('#pwd-input');
                    var submit = function() {
                        if (input.value) { modal.remove(); resolve(input.value); }
                        else alert('密码不能为空');
                    };
                    modal.querySelector('#pwd-submit').onclick = submit;
                    input.onkeypress = function(e) { if (e.key === 'Enter') submit(); };
                    input.focus();
                });
            }

            async function initServerSelect() {
                w.serverList = await (await fetch('/api/servers')).json();
                var sel = document.getElementById('server-select');
                sel.innerHTML = w.serverList.map(function(s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
                w.currentServer = w.serverList[0];
                sel.value = w.currentServer;
                sel.addEventListener('change', function() { switchServer(sel.value); });
            }

            async function c() {
                var password = await promptPassword();
                try {
                    if ((await S.apiFetch('/api/auth', {}, password)).status === 401) {
                        alert('密码错误');
                        return c();
                    }
                    w.apiPassword = password;
                    h.showStatus('验证成功，加载数据...', 2000);
                    h.elements.immersiveBtn.style.display = 'flex';
                    h.elements.rconToggleBtn.style.display = 'flex';
                    await initServerSelect();
                    await loadServerData(w.currentServer, password);
                    a.init();
                    await l('stats');
                    h.showStatus('就绪', 2000);
                    h.centerRconWindow();
                } catch (err) {
                    alert('网络错误，请检查后端');
                    return c();
                }
            }

            // Grim 分割条拖动
            (function() {
                var divider = document.getElementById('grim-divider');
                var leftPanel = document.getElementById('grim-left-panel');
                var container = divider ? divider.parentElement : null;
                if (!divider || !leftPanel || !container) return;
                var startX = 0, startLeftWidth = 0;
                function setLeftWidth(percent) {
                    leftPanel.style.width = Math.min(90, Math.max(10, percent)) + '%';
                }
                S.bindDrag(divider, function(p) {
                    startX = p.x;
                    startLeftWidth = leftPanel.getBoundingClientRect().width;
                    divider.classList.add('dragging');
                    document.body.style.userSelect = 'none';
                    document.body.style.webkitUserSelect = 'none';
                }, function(p) {
                    var containerWidth = container.getBoundingClientRect().width;
                    if (containerWidth <= 0) return;
                    var available = containerWidth - (divider.offsetWidth || 6);
                    setLeftWidth(((startLeftWidth + p.x - startX) / available) * 100);
                }, function() {
                    divider.classList.remove('dragging');
                    document.body.style.userSelect = '';
                    document.body.style.webkitUserSelect = '';
                });
                divider.addEventListener('dblclick', function() { setLeftWidth(50); });
            })();

            // 主启动流程
            (async function() {
                try {
                    var hr = await fetch('/api/highlight_rules');
                    var hrData = await hr.json();
                    w.highlightRules = Array.isArray(hrData) ? hrData : [];
                } catch (e) { w.highlightRules = []; }

                h.init();

                document.getElementById('tab-bar').addEventListener('click', function(e) {
                    var btn = e.target.closest('.tab-button');
                    if (btn) l(btn.getAttribute('data-tab'));
                });

                document.getElementById('range-selector').addEventListener('click', function(e) {
                    var btn = e.target.closest('.range-btn');
                    if (btn) o.loadOnlineStats(btn.getAttribute('data-range'));
                });

                await c();
            })();
        })();
    </script>
</body>
</html>
