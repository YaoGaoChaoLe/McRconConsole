<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport">
    <title>YaoGaoChaoLe_MiniGameServer</title>
    <style>
        /* ===== 全局重置 & 布局 ===== */
        * {
            box-sizing: border-box;
            font-family: '微软雅黑', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 10px;
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
        }

        /* ===== 顶部状态栏 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
            gap: 12px;
            flex-wrap: wrap;
            min-height: 48px;
            border: 1px solid #2c2c2c;
        }

        .status-text {
            font-size: 14px;
            color: #0fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 120px;
        }

        .auto-scroll-check,
        .auto-wrap-check {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            white-space: nowrap;
            color: #ccc;
        }

        .auto-scroll-check input,
        .auto-wrap-check input {
            accent-color: #00ffcc;
        }

        /* ===== 标签栏 ===== */
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            background: #1a1a1a;
            padding: 5px 5px 0 5px;
            border-radius: 6px 6px 0 0;
        }

        .tab-button {
            padding: 8px 16px;
            background: #2c2c2c;
            border: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            color: #ddd;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }

        .tab-button:hover {
            background: #3a3a3a;
            color: #fff;
        }

        .tab-button.active {
            background: #0f0f0f;
            border-bottom-color: #0fc;
            font-weight: 600;
            color: #0fc;
        }

        /* ===== 面板容器 ===== */
        .panel-container {
            flex: 1;
            background: #0f0f0f;
            border-radius: 0 6px 6px 6px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2c2c2c;
            border-top: none;
        }

        .tab-content {
            flex: 1;
            display: none;
            background: #0f0f0f;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .tab-content.active {
            display: flex;
        }

        /* ===== 控制台相关 ===== */
        .console-log-container {
            flex: 1;
            background: #1a1a1a;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            padding: 8px;
            overflow: auto;
        }

        .console-log-line {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .log-textarea {
            flex: 1;
            width: 100%;
            border: none;
            background: #1a1a1a;
            color: #e0e0e0;
            resize: none;
            font-family: Consolas, monospace;
            font-size: 15px;
            line-height: 1.5;
            outline: 0;
            padding: 8px;
            min-height: 0;
        }

        /* ===== 通用子标题 ===== */
        .console-log-area .sub-header,
        .ip-query-area .sub-header,
        .ip-record-area .sub-header,
        .split-half .sub-header,
        .stats-area .sub-header {
            padding: 5px 10px;
            background: #252525;
            font-weight: 600;
            border-bottom: 1px solid #3a3a3a;
            flex-shrink: 0;
            color: #0fc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ===== IP 记录面板 ===== */
        .player-ip-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .ip-record-area {
            flex: 2;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2c2c2c;
        }

        .ip-record-area .sub-header {
            flex-shrink: 0;
        }

        .ip-panel {
            flex: 1;
            overflow: auto;
            padding: 8px;
        }

        .ip-card {
            margin-bottom: 8px;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            background: #0f0f0f;
        }

        .ip-header {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            background: #1a1a1a;
            border-bottom: 1px solid #2c2c2c;
            user-select: none;
        }

        .ip-header:hover {
            background: #252525;
        }

        .ip-header .toggle-icon {
            font-size: 16px;
            margin-right: 8px;
            color: #fff;
        }

        .ip-header .ip-address {
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            margin-right: 12px;
        }

        .ip-header .ip-address.single-player {
            color: #fff;
        }

        .ip-header .ip-address.multi-player {
            color: #ff0;
        }

        .ip-header .ip-address:hover {
            color: #fff;
        }

        .ip-header .stats {
            color: #aaa;
            font-size: 13px;
            word-break: break-all;
            white-space: normal;
            flex: 1;
        }

        .ip-details {
            padding: 8px 12px;
            display: none;
        }

        .ip-details.expanded {
            display: block;
        }

        .login-record-row {
            font-family: monospace;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px dashed #2c2c2c;
            display: flex;
        }

        .login-record-time {
            color: #0fc;
            width: 80px;
            flex-shrink: 0;
        }

        .login-record-player {
            color: #fff;
            margin-left: 12px;
        }

        /* ===== IP 查询区 ===== */
        .console-log-area,
        .ip-query-area {
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2c2c2c;
        }

        .ip-query-area {
            flex: 1;
            min-height: 180px;
        }

        .console-log-area {
            flex: 3;
            min-height: 0;
        }

        .ip-query-row {
            display: flex;
            gap: 8px;
            padding: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .ip-query-row input {
            flex: 3;
            min-width: 150px;
            padding: 8px 12px;
            border: 1px solid #3a3a3a;
            background: #0f0f0f;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: monospace;
        }

        .ip-query-row input:focus {
            outline: 0;
            border-color: #0fc;
            box-shadow: 0 0 2px #0fc;
        }

        .ip-query-row button {
            flex: 1;
            padding: 8px 16px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: .2s;
        }

        .ip-query-row button:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .ip-query-result {
            flex: 1;
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow: auto;
            margin: 0 10px 10px 10px;
            color: #ccc;
        }

        /* ===== 控制台子标题内的控件 ===== */
        .console-log-area .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .line-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .line-control button,
        .scroll-btn {
            padding: 4px 12px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            transition: .2s;
        }

        .line-control button:hover,
        .scroll-btn:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .scroll-buttons {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        /* ===== 统计面板 ===== */
        .stats-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 1px;
            padding: 1px;
            overflow: auto;
        }

        .stats-chart-area {
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #2c2c2c;
            padding: 12px;
            min-height: 300px;
            overflow: hidden;
            position: relative;
        }

        .stats-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stats-chart-header span {
            color: #0fc;
        }

        .range-selector {
            display: flex;
            gap: 8px;
        }

        .range-btn {
            padding: 4px 12px;
            background: #2c2c2c;
            color: #ccc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
        }

        .range-btn.active {
            background: #0fc;
            color: #0a0a0a;
            border-color: #0fc;
        }

        .range-btn:hover:not(.active) {
            background: #3a3a3a;
            color: #fff;
        }

        .performance-charts-row {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
        }

        .performance-charts-row .stats-chart-area {
            flex: 1;
            min-width: 280px;
        }

        .performance-chart-container {
            min-height: auto;
        }

        /* ===== 模态框 ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            border: 1px solid #0fc;
            box-shadow: 0 0 10px rgba(0, 255, 204, .2);
        }

        .modal-card h3 {
            color: #0fc;
            margin-top: 0;
        }

        .modal-card input {
            width: 100%;
            padding: 8px;
            margin: 15px 0;
            border: 1px solid #3a3a3a;
            background: #0f0f0f;
            color: #e0e0e0;
            border-radius: 4px;
        }

        .modal-card input:focus {
            outline: 0;
            border-color: #0fc;
        }

        .modal-card button {
            padding: 8px 16px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }

        .modal-card button:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        /* ===== RCON 浮动窗口 ===== */
        .rcon-floating-window {
            position: fixed;
            width: 450px;
            max-width: 85vw;
            height: 400px;
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(255, 255, 255, .5);
            z-index: 10000;
            display: none;
            flex-direction: column;
            resize: both;
            overflow: hidden;
            min-width: 300px;
            min-height: 200px;
            opacity: .9;
        }

        .rcon-floating-window .rcon-header {
            padding: 8px 12px;
            background: #252525;
            font-weight: 600;
            color: #0fc;
            border-bottom: 1px solid #3a3a3a;
            cursor: move;
            user-select: none;
            border-radius: 8px 8px 0 0;
        }

        .rcon-floating-window .rcon-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .rcon-floating-window .command-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .rcon-floating-window .command-input-row input {
            flex: 3;
            padding: 8px 12px;
            border: 1px solid #3a3a3a;
            background: #0f0f0f;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            font-family: monospace;
        }

        .rcon-floating-window .command-input-row input:focus {
            outline: 0;
            border-color: #0fc;
            box-shadow: 0 0 2px #0fc;
        }

        .rcon-floating-window .command-input-row button {
            flex: 1;
            padding: 8px 16px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
        }

        .rcon-floating-window .command-input-row button:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .rcon-floating-window .result-content {
            background: #0f0f0f;
            border: 1px solid #2c2c2c;
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow: auto;
            flex: 1;
            color: #ccc;
        }

        /* ===== 沉浸式仪表盘 ===== */
        .immersive-dashboard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: none;
            flex-direction: row;
            gap: 2px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 9999;
        }

        body.immersive-mode {
            padding: 0;
            overflow: hidden;
        }

        body.immersive-mode .console-log-area .sub-header,
        body.immersive-mode .panel-container,
        body.immersive-mode .tab-bar,
        body.immersive-mode .top-bar {
            display: none !important;
        }

        body.immersive-mode .rcon-floating-window {
            display: none;
        }

        body.immersive-mode .immersive-dashboard {
            display: flex !important;
        }

        .floating-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10000;
        }

        .floating-btn {
            padding: 5px 5px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: .2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-btn:hover {
            background: #3a3a3a;
            color: #fff;
            border-color: #0fc;
        }

        .immersive-dashboard .left-panel {
            flex: 7;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            min-height: 0;
        }

        .immersive-dashboard .right-panel {
            flex: 5;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            min-height: 0;
        }

        .immersive-dashboard .left-panel .panel:first-child {
            flex: 2;
        }
        .immersive-dashboard .left-panel .panel:last-child {
            flex: 1;
        }
        .immersive-dashboard .right-panel .panel:first-child {
            flex: 2;
        }
        .immersive-dashboard .right-panel .panel:last-child {
            flex: 1;
        }

        .immersive-dashboard .panel {
            background: #1a1a1a;
            border: 1px solid #2c2c2c;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            min-width: 0;
        }

        .immersive-dashboard .panel-header {
            background: #252525;
            padding: 6px 10px;
            font-weight: 600;
            color: #0fc;
            border-bottom: 1px solid #3a3a3a;
            flex-shrink: 0;
        }

        .immersive-dashboard .panel-content {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #ccc;
        }

        #immersive-stats {
            padding: 0;
            height: 100% !important;
            width: 100%;
            min-height: 200px;
        }

        /* ===== Monaco Editor 控制台区域 ===== */
        #monaco-container {
            width: 100%;
            height: 100%;
            border-left: 1px solid #2c2c2c;
            background: #1a1a1a;
        }

        /* Monaco 文本高亮类（动态匹配原 highlight_rules 颜色） */
        .color-ff0000 { color: #ff0000 !important; }
        .color-fbff00 { color: #fbff00 !important; }
        .color-00ffea { color: #00ffea !important; }
        .color-666666 { color: #666666 !important; }
        .color-3bf010 { color: #3bf010 !important; }
        .color-ffffff { color: #ffffff !important; }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #0fc;
        }

        textarea {
            scrollbar-width: thin;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .tab-button {
                padding: 6px 12px;
                font-size: 12px;
            }
            .ip-query-row input {
                flex: 1;
            }
        }

        @media (min-width: 501px) {
            .player-ip-container {
                flex-direction: row;
            }
            .player-ip-container .ip-record-area {
                flex: 7.5;
            }
            .player-ip-container .ip-query-area {
                flex: 2.5;
            }
        }

        /* ===== Grim 面板分割（可配置关键词） ===== */
        .grim-split-container {
            display: flex;
            flex: 1;
            min-height: 0;
            height: 100%;
            width: 100%;
        }

        .grim-panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .grim-left {
            flex-shrink: 0;
            width: 50%;
        }
        .grim-right {
            flex: 1;
        }

        .grim-divider {
            width: 6px;
            flex-shrink: 0;
            cursor: col-resize;
            background: #2c2c2c;
            position: relative;
            transition: background .15s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .grim-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 32px;
            background: #666;
            border-radius: 1px;
            transition: all .15s ease;
        }

        .grim-divider.dragging,
        .grim-divider:hover {
            background: #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, .4);
        }

        .grim-divider.dragging::before,
        .grim-divider:hover::before {
            background: #0a0a0a;
            height: 44px;
        }

        @media (max-width: 600px) {
            .grim-split-container {
                flex-direction: column;
            }
            .grim-left {
                width: 100% !important;
                flex: 1;
            }
            .grim-right {
                flex: 1;
            }
            .grim-divider {
                display: none;
            }
        }

        /* 配置面板 */
        .config-panel {
            background: #1a1a1a;
            border-bottom: 1px solid #2c2c2c;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .config-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .config-row label {
            min-width: 90px;
            color: #ccc;
        }
        .config-row input {
            flex: 1;
            min-width: 200px;
            padding: 6px 8px;
            background: #0f0f0f;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            font-family: monospace;
        }
        .config-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .config-actions button {
            padding: 6px 14px;
            background: #2c2c2c;
            color: #0fc;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .config-actions button:hover {
            background: #3a3a3a;
            color: #fff;
        }
        .config-toggle {
            cursor: pointer;
            color: #FFD700;
            text-decoration: underline;
            font-size: 13px;
        }
        .config-toggle:hover {
            color: #FFA500;
        }
        .config-hint {

<body>

    <!-- ===== RCON 浮动窗口 ===== -->
    <div class="rcon-floating-window" id="rcon-floating">

    <!-- ============================================================ -->
    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 全局状态 w
            // ============================================================
            const w = {
                apiPassword: null,
                currentTab: 'console',
                chatLines: [],
                joinQuitLines: [],
                grimLines: [],
                serverLines: [],
                ipLoginRecords: [],
                cmdHistory: [],
                historyIdx: -1,
                highlightRules: [],
                expandedIps: new Set(),
                immersiveMode: false,
                autoScrollEnabled: true,
                autoWrapEnabled: false,
                screenCaptureTimer: null,
                onlineChart: null,
                cpuCharts: [],
                memChart: null,
                netChart: null,
                performanceData: {
                    cpu: [],
                    mem: [],
                    upload: [],
                    download: [],
                    cpuPerCore: []
                },
                currentStatsRange: '1d',
                statsRefreshTimer: null,
                resizeHandlerAttached: false,
                immersiveChart: null,
                immersiveStatsTimer: null,
                anticheatKeywords: [],
                grimConfig: {
                    leftKeywords: ["触发了", "[Server]"],
                    rightKeywords: ["[Server]", "moved too quickly"]
                },
                rawLogLines: [], // 用于保存原始日志，以便重新过滤
                fullTimes: [],
                fullCounts: [],
                fullMissingRanges: []
            };

            // ============================================================
            // 工具函数 S
            // ============================================================
            const S = {
                escapeHtml: function(text) {
                    return text.replace(/[&<>]/g, function(m) {
                        if (m === '&') return '&amp;';
                        if (m === '<') return '&lt;';
                        if (m === '>') return '&gt;';
                        return m;
                    });
                },

                getHighlightColor: function(line, rules) {
                    for (const rule of rules) {
                        if (line.toLowerCase().includes(rule.keyword.toLowerCase())) {
                            return rule.color;
                        }
                    }
                    return '';
                },

                isContainerAtBottom: function(el) {
                    if (!el) return true;
                    return (el.scrollHeight - el.scrollTop - el.clientHeight) <= 5;
                },

                scrollContainerToBottom: function(el) {
                    if (el) el.scrollTop = el.scrollHeight;
                },

                smoothScrollToBottomDynamic: function(el, duration) {
                    if (!el) return;
                    if (el._scrollAnim) cancelAnimationFrame(el._scrollAnim);
                    var startScroll = el.scrollTop;
                    var startTime = performance.now();
                    var that = this;

                    function animate(time) {
                        var progress = Math.min((time - startTime) / duration, 1);
                        var eased = progress * (2 - progress);
                        var targetScroll = el.scrollHeight - el.clientHeight;
                        var newTop = startScroll + (targetScroll - startScroll) * eased;
                        el.scrollTop = Math.min(Math.max(newTop, 0), targetScroll);
                        if (progress < 1) {
                            el._scrollAnim = requestAnimationFrame(animate);
                        } else {
                            el.scrollTop = targetScroll;
                            delete el._scrollAnim;
                            w.autoScrollEnabled = true;
                            var cb = document.getElementById('auto-scroll');
                            if (cb) cb.checked = true;
                        }
                    }
                    el._scrollAnim = requestAnimationFrame(animate);
                },

                smoothScrollToTop: function(el, duration) {
                    if (!el) return;
                    if (el._scrollAnim) cancelAnimationFrame(el._scrollAnim);
                    var startScroll = el.scrollTop;
                    if (startScroll === 0) return;
                    var startTime = performance.now();

                    function animate(time) {
                        var progress = Math.min((time - startTime) / duration, 1);
                        var eased = progress * (2 - progress);
                        el.scrollTop = startScroll * (1 - eased);
                        if (progress < 1) {
                            el._scrollAnim = requestAnimationFrame(animate);
                        } else {
                            delete el._scrollAnim;
                            w.autoScrollEnabled = false;
                            var cb = document.getElementById('auto-scroll');
                            if (cb) cb.checked = false;
                        }
                    }
                    el._scrollAnim = requestAnimationFrame(animate);
                }
            };

            // ============================================================
            // 日志处理器 r
            // ============================================================
            var r = {
                extractPlayerName: function(line) {
                    var match = line.match(/([a-zA-Z0-9_]+)\s*\[\/\d+\.\d+\.\d+\.\d+:\d+\]/);
                    return match ? match[1] : '';
                },

                processLine: function(line) {
                    var raw = line;
                    var isChat = raw.includes('聊') || raw.includes('[Not Secure]') || raw.includes('[Server]') ||
                        raw.includes('[Rcon]') || raw.includes('[TEAM_ONLY]') || raw.includes('[SHOUT]') ||
                        /<[a-zA-Z0-9_]+>/.test(raw);
                    var isJoinQuit = raw.includes('lost connection');
                    var isGrim = w.grimConfig.leftKeywords.some(function(kw) { return raw.includes(kw); });
                    var isServer = w.grimConfig.rightKeywords.some(function(kw) { return raw.includes(kw); });
                    var isLogin = raw.includes('logged in');

                    raw = raw.replace('[Server thread/INFO]: [Not Secure] ', '');
                    raw = raw.replace('[Server thread/INFO]: ', '');

                    if (isChat) w.chatLines.push(raw);
                    if (isJoinQuit) w.joinQuitLines.push(raw);
                    if (isGrim) w.grimLines.push(raw);
                    if (isServer) w.serverLines.push(raw);

                    if (isLogin) {
                        var timeMatch = raw.match(/\[(\d{2}:\d{2}:\d{2})\]/);
                        var player = this.extractPlayerName(raw);
                        var ipMatch = raw.match(/\/(\d+\.\d+\.\d+\.\d+):\d+\]/);
                        if (timeMatch && player && ipMatch) {
                            w.ipLoginRecords.push({
                                time: timeMatch[1],
                                player: player,
                                ip: ipMatch[1]
                            });
                            if (w.currentTab === 'playerip') {
                                h.scheduleIpPanelRender();
                            }
                        }
                    }

                    h.updateImmersiveDashboard();
                },

                refreshAllDataFromRaw: function(rawText) {
                    w.chatLines = [];
                    w.joinQuitLines = [];
                    w.grimLines = [];
                    w.serverLines = [];
                    w.ipLoginRecords = [];
                    var lines = rawText.split(/\r?\n/);
                    w.rawLogLines = lines;
                    for (var i = 0; i < lines.length; i++) {
                        this.processLine(lines[i]);
                    }
                    if (w.currentTab !== 'console') {
                        h.updateNonConsoleTab();
                    }
                }
            };

            // ============================================================
            // 界面控制 h
            // ============================================================
            var h = {
                elements: {},
                ipPanelRenderTimer: null,

                init: function() {
                    this.elements = {
                        status: document.getElementById('status'),
                        autoScroll: document.getElementById('auto-scroll'),
                        autoWrap: document.getElementById('auto-wrap'),
                        chatText: document.getElementById('chat-text'),
                        joinquitText: document.getElementById('joinquit-text'),
                        grimText: document.getElementById('grim-text'),
                        serverText: document.getElementById('server-text'),
                        ipPanel: document.getElementById('ip-panel'),
                        ipInput: document.getElementById('ip-input'),
                        ipResult: document.getElementById('ip-query-result'),
                        rconCommand: document.getElementById('rcon-command'),
                        rconResult: document.getElementById('rcon-result'),
                        immersiveBtn: document.getElementById('immersive-floating-btn'),
                        rconToggleBtn: document.getElementById('rcon-toggle-btn'),
                        rconWindow: document.getElementById('rcon-floating'),
                        immersiveConsole: document.getElementById('immersive-console'),
                        immersiveChat: document.getElementById('immersive-chat'),
                        immersiveGrim: document.getElementById('immersive-grim'),
                        immersiveStats: document.getElementById('immersive-stats'),
                        progressDiv: document.getElementById('log-load-progress'),
                        grimConfigToggle: document.getElementById('grim-config-toggle')
                    };

                    this.bindEvents();
                    this.initDraggable();
                    this.initMonaco();

                    var self = this;
                    ['chatText', 'joinquitText', 'grimText', 'serverText', 'ipPanel'].forEach(function(id) {
                        var el = self.elements[id];
                        if (el) {
                            el.addEventListener('scroll', function() {
                                self.updateAutoScrollCheck();
                            });
                        }
                    });
                },

                initMonaco: function() {
                    var self = this;
                    var overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.style.display = 'flex';

                    require(['vs/editor/editor.main'], function() {
                        var container = document.getElementById('monaco-container');
                        if (!container) return;

                        var style = document.createElement('style');
                        var css = '';
                        w.highlightRules.forEach(function(rule) {
                            var color = rule.color.replace('#', '');
                            css += '.color-' + color + ' { color: ' + rule.color + ' !important; }';
                        });
                        style.innerHTML = css;
                        document.head.appendChild(style);

                        self.monacoModel = monaco.editor.createModel('', 'plaintext');
                        self.monacoEditor = monaco.editor.create(container, {
                            model: self.monacoModel,
                            theme: 'vs-dark',
                            minimap: {
                                enabled: true, 
                                renderCharacters: false
                            },
                            wordWrap: w.autoWrapEnabled ? 'on' : 'off',
                            scrollBeyondLastLine: false,
                            automaticLayout: true,
                            readOnly: true,
                            lineNumbers: true,
                            fontSize: 14,
                            lineHeight: 20
                        });

                        self.monacoEditor.onDidScrollChange(function() {
                            self.updateAutoScrollCheck();
                        });

                        if (self.monacoModel.getValueLength() > 0) {
                            self.updateDecorations();
                        }

                        if (overlay) overlay.style.display = 'none';

                    }, function(err) {
                        console.error('Monaco CDN 加载失败:', err);
                        if (overlay) {
                            overlay.innerHTML = '<div style="color: #ff4343; text-align: center;">加载 Monaco 引擎失败！<br>请检查网络连接后刷新页面。</div>';
                        }
                    });
                },
                updateDecorations: function() {
                    if (!this.monacoEditor) return;
                    var model = this.monacoEditor.getModel();
                    var rules = w.highlightRules;
                    var newDecorations = [];
                    var matchedLines = new Set(); // 新增：记录已经匹配过的行，实现“从上到下优先级高”

                    for (var i = 0; i < rules.length; i++) {
                        var rule = rules[i];
                        var keyword = rule.keyword;
                        var regexStr = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        var regex = new RegExp(regexStr, "i");

                        // 注意：这里的第四个参数改为了 false（不区分大小写），解决了 warn 匹配不到 WARN 的问题
                        var matches = model.findMatches(regex.source, false, true, false, null, true);
                        
                        for (var j = 0; j < matches.length; j++) {
                            var lineNum = matches[j].range.startLineNumber;
                            
                            // 如果当前行已经被更高优先级的规则匹配过，则直接跳过，防止颜色被覆盖
                            if (!matchedLines.has(lineNum)) {
                                matchedLines.add(lineNum);
                                newDecorations.push({
                                    range: matches[j].range,
                                    options: { 
                                        isWholeLine: true,

                applyAnticheatConfig: function() {
                    var leftRaw = document.getElementById('grim-left-keywords').value.trim();
                    var rightRaw = document.getElementById('grim-right-keywords').value.trim();
                    var leftKeywords = leftRaw.split(',').map(k => k.trim()).filter(k => k.length > 0);
                    var rightKeywords = rightRaw.split(',').map(k => k.trim()).filter(k => k.length > 0);

                    w.grimConfig.leftKeywords = leftKeywords;
                    w.grimConfig.rightKeywords = rightKeywords;

                    this.reclassifyAnticheatLines();
                    document.getElementById('grim-config-panel').style.display = 'none';
                    this.showStatus('反作弊关键词已更新', 2000);
                },

                resetAnticheatConfig: function() {
                    w.grimConfig = {
                        leftKeywords: ["触发了", "[Server]"],
                        rightKeywords: ["[Server]", "moved too quickly"]
                    };
                    document.getElementById('grim-left-keywords').value = w.grimConfig.leftKeywords.join(',');
                    document.getElementById('grim-right-keywords').value = w.grimConfig.rightKeywords.join(',');
                    this.reclassifyAnticheatLines();
                    this.showStatus('已重置为默认关键词', 2000);
                },

                reclassifyAnticheatLines: function() {
                    var leftKeys = w.grimConfig.leftKeywords;
                    var rightKeys = w.grimConfig.rightKeywords;
                    var newGrim = [];
                    var newServer = [];

                    var rawLines = w.rawLogLines || [];
                    var BATCH = 5000;
                    var index = 0;
                    var self = this;
                    var statusEl = this.elements.status;
                    var progressEl = document.getElementById('log-load-progress');
                    progressEl.style.display = 'block';
                    var total = rawLines.length;

                    function processBatch() {
                        var end = Math.min(index + BATCH, total);
                        for (var i = index; i < end; i++) {
                            var line = rawLines[i];
                            var cleaned = line.replace('[Server thread/INFO]: [Not Secure] ', '')
                                .replace('[Server thread/INFO]: ', '');
                            if (leftKeys.some(kw => line.toLowerCase().includes(kw.toLowerCase()))) newGrim.push(cleaned);
                            if (rightKeys.some(kw => line.toLowerCase().includes(kw.toLowerCase()))) newServer.push(cleaned);
                        }
                        index = end;
                        var pct = Math.round((index / total) * 100);
                        statusEl.innerText = '正在重新分类反作弊日志... ' + index + '/' + total + ' (' + pct + '%)';
                        progressEl.innerText = ' 🔄 重新过滤 ' + index + '/' + total + ' (' + pct + '%)';

                        if (index < total) {
                            requestAnimationFrame(processBatch);
                        } else {
                            w.grimLines = newGrim;
                            w.serverLines = newServer;
                            self.updateNonConsoleTab();
                            progressEl.style.display = 'none';
                            statusEl.innerText = w.totalLines + ' 行日志已加载';
                            if (w.currentTab === 'grim' && w.autoScrollEnabled) {
                                S.smoothScrollToBottomDynamic(self.elements.grimText, 200);
                                S.smoothScrollToBottomDynamic(self.elements.serverText, 200);
                            }
                        }
                    }
                    requestAnimationFrame(processBatch);
                },

                setAllWrapMode: function(enabled) {
                    var mode = enabled ? 'pre-wrap' : 'pre';
                    var wordBreak = enabled ? 'break-word' : 'normal';

                    function apply(el) {
                        if (!el) return;
                        if (el.tagName === 'TEXTAREA') {
                            el.style.whiteSpace = mode;
                            el.style.wordWrap = wordBreak;
                        } else {
                            el.style.whiteSpace = mode;
                            el.style.wordWrap = wordBreak;
                            Array.from(el.querySelectorAll('.console-log-line')).forEach(function(line) {
                                line.style.whiteSpace = mode;
                                line.style.wordWrap = wordBreak;
                            });
                        }
                    }

                    apply(this.elements.chatText);
                    apply(this.elements.joinquitText);
                    apply(this.elements.grimText);
                    apply(this.elements.serverText);

                    if (this.monacoEditor) {
                        this.monacoEditor.updateOptions({ wordWrap: enabled ? 'on' : 'off' });
                    }
                    w.autoWrapEnabled = enabled;
                },

                onAutoScrollChange: function() {
                    w.autoScrollEnabled = this.elements.autoScroll.checked;
                    if (!w.autoScrollEnabled) return;
                    var tab = w.currentTab;
                    if (tab === 'chat') {
                        S.smoothScrollToBottomDynamic(this.elements.chatText, 200);
                    } else if (tab === 'joinquit') {
                        S.smoothScrollToBottomDynamic(this.elements.joinquitText, 200);
                    } else if (tab === 'grim') {
                        S.smoothScrollToBottomDynamic(this.elements.grimText, 200);
                        S.smoothScrollToBottomDynamic(this.elements.serverText, 200);
                    } else if (tab === 'playerip') {
                        S.smoothScrollToBottomDynamic(this.elements.ipPanel, 200);
                    } else if (tab === 'console') {
                        if (this.monacoEditor) {
                            this.monacoEditor.revealLineInCenter(this.monacoEditor.getModel().getLineCount(), monaco.editor.ScrollType.Smooth);
                        }
                    }
                },

                updateAutoScrollCheck: function() {
                    var self = this;
                    if (this._scrollCheckTimer) clearTimeout(this._scrollCheckTimer);
                    this._scrollCheckTimer = setTimeout(function() {
                        var allAtBottom = true;
                        if (self.monacoEditor) {
                            var scrollTop = self.monacoEditor.getScrollTop();
                            var scrollHeight = self.monacoEditor.getScrollHeight();
                            var clientHeight = self.monacoEditor.getLayoutInfo().height;
                            if (scrollHeight - scrollTop - clientHeight > 5) {
                                allAtBottom = false;
                            }
                        }
                        var containers = [
                            self.elements.chatText,
                            self.elements.joinquitText,
                            self.elements.grimText,
                            self.elements.serverText,
                            self.elements.ipPanel
                        ];
                        for (var i = 0; i < containers.length; i++) {
                            var el = containers[i];
                            if (el && !S.isContainerAtBottom(el)) {
                                allAtBottom = false;
                                break;
                            }
                        }
                        if (self.elements.autoScroll.checked !== allAtBottom) {
                            self.elements.autoScroll.checked = allAtBottom;
                            w.autoScrollEnabled = allAtBottom;
                        }
                    }, 100);
                },

                appendLogLines: function(lines) {
                    if (!this.monacoEditor || !lines.length) return;
                    var model = this.monacoEditor.getModel();
                    var lastLine = model.getLineCount();
                    var text = lines.join('\n');
                    model.pushEditOperations([], [{
                        range: new monaco.Range(lastLine, model.getLineMaxColumn(lastLine), lastLine, model.getLineMaxColumn(lastLine)),
                        text: '\n' + text,
                        forceMoveMarkers: true
                    }]);
                    if (w.autoScrollEnabled) {
                        this.monacoEditor.revealLineInCenter(model.getLineCount(), monaco.editor.ScrollType.Smooth);
                    }
                    this.updateImmersiveDashboard();
                    this.updateDecorations();

                renderConsoleLog: function(text) {
                    if (!this.monacoEditor) return;

                    this.updateDecorations();

                updateNonConsoleTab: function() {
                    var tab = w.currentTab;
                    if (tab === 'console') return;
                    switch (tab) {
                        case 'chat':
                            this.updateTextareaWithSelection(this.elements.chatText, w.chatLines.join('\n'));
                            break;
                        case 'joinquit':
                            var sorted = w.joinQuitLines.slice().sort(function(a, b) {
                                var t1 = (a.match(/\[(\d{2}:\d{2}:\d{2})\]/) || [])[1] || '';
                                var t2 = (b.match(/\[(\d{2}:\d{2}:\d{2})\]/) || [])[1] || '';
                                return t1.localeCompare(t2);
                            });
                            this.updateTextareaWithSelection(this.elements.joinquitText, sorted.join('\n'));
                            break;
                        case 'grim':
                            this.updateTextareaWithSelection(this.elements.grimText, w.grimLines.join('\n'));
                            this.updateTextareaWithSelection(this.elements.serverText, w.serverLines.join('\n'));
                            break;
                        case 'playerip':
                            this.renderIpPanel();
                            return;
                        default:
                            break;
                    }
                    if (w.autoScrollEnabled) {
                        if (tab === 'chat') {
                            S.smoothScrollToBottomDynamic(this.elements.chatText, 200);
                        } else if (tab === 'joinquit') {
                            S.smoothScrollToBottomDynamic(this.elements.joinquitText, 200);
                        } else if (tab === 'grim') {
                            S.smoothScrollToBottomDynamic(this.elements.grimText, 200);
                            S.smoothScrollToBottomDynamic(this.elements.serverText, 200);
                        }
                    }
                    this.updateImmersiveDashboard();

                updateTextareaWithSelection: function(textarea, value) {
                    if (!textarea) return;
                    var selStart = textarea.selectionStart;
                    var selEnd = textarea.selectionEnd;
                    textarea.value = value;
                    if (selStart !== undefined && selEnd !== undefined && value.length >= selEnd) {
                        textarea.selectionStart = selStart;
                        textarea.selectionEnd = selEnd;
                    } else if (selStart !== undefined && value.length >= selStart) {
                        textarea.selectionStart = selStart;
                        textarea.selectionEnd = selStart;
                    }
                },

                // 简化后的 renderIpPanel：不再按省份分组
                renderIpPanel: function() {
                    var map = new Map();
                    for (var i = 0; i < w.ipLoginRecords.length; i++) {
                        var rec = w.ipLoginRecords[i];
                        if (!map.has(rec.ip)) {
                            map.set(rec.ip, { records: [], playersSet: new Set() });
                        }
                        var entry = map.get(rec.ip);
                        entry.records.push({ time: rec.time, player: rec.player });
                        entry.playersSet.add(rec.player);
                    }

                    if (map.size === 0) {
                        this.elements.ipPanel.innerHTML = '<div style="color:#aaa;padding:12px;text-align:center;">无登录记录</div>';
                        return;
                    }

                    var html = '';
                    for (var pair of map.entries()) {
                        var ip = pair[0];
                        var data = pair[1];
                        var uniquePlayers = data.playersSet.size;
                        var cls = uniquePlayers > 1 ? 'multi-player' : 'single-player';
                        var names = Array.from(data.playersSet).sort().join(' // ');
                        var ipExpanded = w.expandedIps.has(ip);
                        html += '<div class="ip-card" data-ip="' + ip + '">';
                        html += '<div class="ip-header" data-ip="' + ip + '">';
                        html += '<span class="toggle-icon">' + (ipExpanded ? '▼' : '▶') + '</span>';
                        html += '<span class="ip-address ' + cls + '" data-ip="' + ip + '">' + ip + '</span>';
                        html += '<span class="stats">(' + data.records.length + '次登录, ' + uniquePlayers +
                            '个玩家: ' + names + ')</span>';
                        html += '</div>';
                        html += '<div class="ip-details ' + (ipExpanded ? 'expanded' : '') + '" data-ip="' + ip + '">';
                        var sortedRecs = data.records.slice().sort(function(a, b) {
                            return a.time.localeCompare(b.time);
                        });
                        for (var ri = 0; ri < sortedRecs.length; ri++) {
                            var rec2 = sortedRecs[ri];
                            html += '<div class="login-record-row">';
                            html += '<span class="login-record-time">' + rec2.time + '</span>';
                            html += '<span class="login-record-player">' + S.escapeHtml(rec2.player) + '</span>';
                            html += '</div>';
                        }
                        html += '</div></div>';
                    }

                    this.elements.ipPanel.innerHTML = html;
                    if (w.autoScrollEnabled && w.currentTab === 'playerip') {
                        S.smoothScrollToBottomDynamic(this.elements.ipPanel, 200);
                    }
                },

                queryIP: function(ip) {
                    if (!ip.trim()) {
                        this.elements.ipResult.innerText = '请输入 IP';
                        return;

                    var resultEl = this.elements.ipResult;
                    var queries = [{
                        name: '=========== 结果1 ===========',

                            return fetch('https://api.ip77.net/ip2/v4/', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: 'ip=' + encodeURIComponent(ip)
                            }).then(function(res) { return res.json(); }).then(function(data) {
                                if (data.code !== 0 || !data.data) throw new Error(data.error || '查询失败');
                                var d = data.data;
                                return {
                                    location: d.location || '未知',
                                    lat: d.latitude,
                                    lng: d.longitude,
                                    street: d.street_history && d.street_history.length ? d.street_history
                                        .join('、') : '无街道信息'
                                };
                            });
                        }
                    }, {
                        name: '=========== 结果2 ===========',

                                '?fields=status,country,regionName,city,lat,lon,isp,org'

                                if (data.status !== 'success') throw new Error(data.message || '查询失败');
                                return {
                                    location: data.country + ' ' + data.regionName + ' ' + data.city,
                                    lat: data.lat,
                                    lng: data.lon,
                                    street: 'ISP: ' + (data.isp || '未知')

                            });
                        }
                    }, {
                        name: '=========== 结果3 ===========',
                        fetch: function(ip) {
                            return fetch('https://ipapi.co/' + ip + '/json/').then(function(res) { return res
                                    .json(); }).then(function(data) {
                                if (data.error) throw new Error(data.reason || '查询失败');
                                return {
                                    location: data.country_name + ' ' + data.region + ' ' + data.city,
                                    lat: data.latitude,
                                    lng: data.longitude,
                                    street: 'ASN: ' + data.asn
                                };
                            });
                        }
                    }, {
                        name: '=========== 结果4 ===========',
                        fetch: function(ip) {
                            return fetch('https://ipinfo.io/' + ip + '/json').then(function(res) { return res
                                    .json(); }).then(function(data) {
                                if (data.bogon || data.error) throw new Error(data.error || '查询失败');
                                var loc = data.loc ? data.loc.split(',') : [];
                                return {
                                    location: data.country + ' ' + data.region + ' ' + data.city,
                                    lat: loc[0] || null,
                                    lng: loc[1] || null,
                                    street: '组织: ' + (data.org || '未知')

                        name: '=========== 结果5 ===========',
                        fetch: function(ip) {
                            return fetch('https://ipwho.is/' + ip).then(function(res) { return res.json(); })
                                .then(function(data) {
                                    if (!data.success) throw new Error(data.message || '查询失败');
                                    return {
                                        location: data.country + ' ' + data.region + ' ' + data.city,
                                        lat: data.latitude,
                                        lng: data.longitude,

                    var html = '';

                            .name + '】\n查询中...</div>';

                    resultEl.innerHTML = html;

                    for (var qi = 0; qi < queries.length; qi++) {

                                if (el) {

                                        .location + '\n经纬度: ' + result.lng + ',' + result.lat +
                                        '\n详细: ' + result.street;
                                }
                            }).catch(function(err) {
                                var el = document.getElementById('ip-result-' + index);
                                if (el) {
                                    el.innerText = '\n\n【' + queries[index].name + '】\n失败: ' + err.message;

                    }
                    var text = this.monacoEditor.getValue();
                    var self = this;
                    if (navigator.clipboard && navigator.clipboard.writeText) {

                        });

                        this.fallbackCopy(text, 0);

                fallbackCopy: function(text, count) {
                    var ta = document.createElement('textarea');

                    document.body.removeChild(ta);

                showStatus: function(msg, timeout) {

                        var self = this;

                updateImmersiveDashboard: function() {
                    if (!w.immersiveMode) return;
                    var self = this;

                    if (this.elements.immersiveConsole) {
                        var consoleLines = [];
                        if (this.monacoEditor) {
                            var model = this.monacoEditor.getModel();
                            var lastLine = model.getLineCount();
                            var startLine = Math.max(1, lastLine - 500);
                            for (var lineNum = startLine; lineNum <= lastLine; lineNum++) {
                                consoleLines.push(model.getLineContent(lineNum));
                            }
                        }
                        var slice = consoleLines.slice(-500);
                        var currentTexts = Array.from(this.elements.immersiveConsole.children).map(function(el) {
                            return el.textContent;
                        });
                        if (JSON.stringify(currentTexts) !== JSON.stringify(slice)) {
                            this.elements.immersiveConsole.innerHTML = '';
                            for (var i = 0; i < slice.length; i++) {
                                var div = document.createElement('div');
                                div.className = 'console-log-line';
                                var color = S.getHighlightColor(slice[i], w.highlightRules);

                    if (!header || !windowEl) return;

                    var isDragging = false;
                    var offsetX = 0,
                        offsetY = 0;
                    var startX = 0,
                        startY = 0;

                    function getPos(e) {
                        var ev = e.touches ? e.touches[0] : e;
                        return { clientX: ev.clientX, clientY: ev.clientY };
                    }

                    function onMove(e) {
                        if (!isDragging) return;
                        e.preventDefault();
                        var pos = getPos(e);
                        var dx = pos.clientX - offsetX;
                        var dy = pos.clientY - offsetY;
                        var maxX = window.innerWidth - windowEl.offsetWidth;
                        var maxY = window.innerHeight - windowEl.offsetHeight;
                        dx = Math.min(Math.max(dx, 0), maxX);
                        dy = Math.min(Math.max(dy, 0), maxY);
                        windowEl.style.left = dx + 'px';
                        windowEl.style.top = dy + 'px';
                        windowEl.style.bottom = '';
                        windowEl.style.right = '';
                    }

                    function onUp() {
                        isDragging = false;
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onUp);
                    }

                    function onDown(e) {
                        if (e.button !== undefined && e.button !== 0) return;
                        e.preventDefault();
                        var rect = windowEl.getBoundingClientRect();
                        var pos = getPos(e);
                        offsetX = pos.clientX - rect.left;
                        offsetY = pos.clientY - rect.top;
                        isDragging = true;
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                        document.addEventListener('touchmove', onMove, { passive: false });
                        document.addEventListener('touchend', onUp);
                    }

                    header.addEventListener('mousedown', onDown);
                    header.addEventListener('touchstart', onDown, { passive: false });
