                            }
                            return true;
                        } else {
                            h.elements.rconResult.innerText = '错误：' + data.output;
                            return false;
                        }
                    } catch (err) {
                        h.elements.rconResult.innerText = '网络错误：' + err.message;
                        return false;
                    }
                },

                onKeydown: function(e) {
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (w.cmdHistory.length && w.historyIdx > 0) {
                            w.historyIdx--;
                            h.elements.rconCommand.value = w.cmdHistory[w.historyIdx];
                        } else if (w.historyIdx === w.cmdHistory.length && w.cmdHistory.length) {
                            w.historyIdx = w.cmdHistory.length - 1;
                            h.elements.rconCommand.value = w.cmdHistory[w.historyIdx];
                        }
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (w.cmdHistory.length && w.historyIdx < w.cmdHistory.length - 1) {
                            w.historyIdx++;
                            h.elements.rconCommand.value = w.cmdHistory[w.historyIdx];
                        } else if (w.cmdHistory.length && w.historyIdx === w.cmdHistory.length - 1) {
                            w.historyIdx = w.cmdHistory.length;
                            h.elements.rconCommand.value = '';
                        }
                    }
                }
            };


            // ============================================================
            // 统计图表 o (修改部分)
            // ============================================================
            var o = {
                // 加载在线人数统计（始终请求全部数据，用 dataZoom 控制窗口）
                loadOnlineStats: async function(range, immersive) {
                    immersive = immersive || false;
                    try {
                        var resp = await fetch('/api/stats/online?range=all', {
                            headers: { 'Authorization': 'Bearer ' + w.apiPassword }
                        });
                        var data = await resp.json();
                        if (!data.success) return;

                        var times = data.data.times;
                        var counts = data.data.counts;
                        var missingRanges = data.data.missingRanges;

                        // 缓存全量数据（以备后续扩展）
                        w.fullTimes = times;
                        w.fullCounts = counts;
                        w.fullMissingRanges = missingRanges;

                        var totalPoints = times.length;
                        var hasZoom = false;
                        var startVal = 0;
                        var endVal = 100;
                        var effectiveRange = range; // 可能回退为 'all'
                        var targetWidth = 0;         // 预设窗口宽度（百分比），用于事件锁定

                        // 只有非“全部”且数据点大于1才计算窗口
                        if (range !== 'all' && totalPoints > 1) {
                            var startTime = new Date(times[0]).getTime();
                            var endTime = new Date(times[totalPoints - 1]).getTime();
                            var totalDays = (endTime - startTime) / (1000 * 60 * 60 * 24);

                            var windowDays = 1;
                            if (range === '3d') windowDays = 3;
                            else if (range === '7d') windowDays = 7;
                            else if (range === '1d') windowDays = 1;

                            // 方案A：总跨度 <= 窗口天数，回退为全部
                            if (totalDays <= windowDays) {
                                hasZoom = false;
                                effectiveRange = 'all';
                            } else {
                                hasZoom = true;
                                var windowPercent = (windowDays / totalDays) * 100;
                                // 锚定右侧（最新数据），start 向左延伸
                                var zoomEnd = 100;
                                var zoomStart = Math.max(0, 100 - windowPercent);
                                startVal = zoomStart;
                                endVal = zoomEnd;
                                targetWidth = windowPercent; // 保存目标宽度
                            }
                        }

                        // 基础图表配置
                        var option = {
                            tooltip: { trigger: 'axis' },
                            xAxis: {
                                type: 'category',
                                data: times,
                                axisLabel: { rotate: 45, interval: 'auto' }
                            },
                            yAxis: {
                                type: 'value',
                                name: '在线人数',
                                minInterval: 1,
                                axisLabel: {
                                    formatter: function(value) {
                                        return Number.isInteger(value) ? value : '';
                                    }
                                }
                            },
                            series: [{
                                type: 'line',
                                data: counts.map(function(v) {
                                    return v === null ? undefined : v;
                                }),
                                smooth: false,
                                lineStyle: { color: '#00ffcc' },
                                areaStyle: { opacity: 0.2, color: '#00ffcc' },
                                itemStyle: { color: '#00ffcc' },
                                connectNulls: false,
                                markArea: {
                                    silent: true,
                                    itemStyle: { color: 'rgba(255,30,30,0.5)' },
                                    data: missingRanges.map(function(r) {
                                        return [
                                            { xAxis: r.startIdx, yAxis: 'min' },
                                            { xAxis: r.endIdx, yAxis: 'max' }
                                        ];
                                    })
                                }
                            }],
                            grid: { top: 28, bottom: 45, left: '9%', right: '15%', containLabel: true }
                        };

                        // 如果需要滑块，则添加 dataZoom（允许拖动手柄，但我们用事件强制宽度）
                        if (hasZoom) {
                            option.dataZoom = [{
                                type: 'slider',
                                start: startVal,
                                end: endVal,
                                zoomLock: true,
                                showDetail: true,
                                bottom: 10,
                                height: 20,
                                borderColor: '#2c2c2c',
                                fillerColor: 'rgba(0,255,204,0.2)',
                                handleStyle: { color: '#00ffcc' },
                                textStyle: { color: '#ccc' }
                            }];
                        }

                        // 渲染图表
                        var chart;
                        if (immersive) {
                            chart = w.immersiveChart;
                            if (!chart) {
                                chart = echarts.init(h.elements.immersiveStats);
                            }
                            chart.setOption(option, true);
                            setTimeout(function() { chart.resize(); }, 50);
                            w.immersiveChart = chart;
                        } else {
                            if (!w.onlineChart) {
                                w.onlineChart = echarts.init(document.getElementById('online-chart'));
                                if (!w.resizeHandlerAttached) {
                                    window.addEventListener('resize', function() {
                                        if (w.onlineChart) w.onlineChart.resize();
                                        o.resizeAllCharts();
                                    });
                                    w.resizeHandlerAttached = true;
                                }
                            }
                            chart = w.onlineChart;
                            chart.setOption(option, true);
                            chart.resize();
                        }

                        // 绑定 datazoom 事件：当用户拖拽手柄改变宽度时，强制恢复为预设宽度（仅限非 'all' 且有缩放）
                        if (hasZoom && effectiveRange !== 'all') {
                            var targetWidthCopy = targetWidth; // 闭包捕获
                            chart.off('datazoom'); // 移除旧监听，避免重复绑定
                            chart.on('datazoom', function(params) {
                                var currentStart = params.start;
                                var currentEnd = params.end;
                                var currentWidth = currentEnd - currentStart;
                                // 如果当前宽度与目标宽度差异超过 0.5%，则修正
                                if (Math.abs(currentWidth - targetWidthCopy) > 0.5) {
                                    // 保持右侧锚定（end=100），重新计算 start
                                    var newStart = 100 - targetWidthCopy;
                                    newStart = Math.max(0, Math.min(100 - targetWidthCopy, newStart));
                                    chart.setOption({
                                        dataZoom: [{
                                            start: newStart,
                                            end: 100
                                        }]
                                    });
                                }
                            });
                        }

                        // 统一高亮按钮（如果回退到 'all'，则高亮“全部”按钮）
                        document.querySelectorAll('#range-selector .range-btn').forEach(function(btn) {
                            btn.classList.remove('active');
                        });
                        var activeBtn = document.querySelector('#range-selector .range-btn[data-range="' + effectiveRange + '"]');
                        if (activeBtn) activeBtn.classList.add('active');
                        w.currentStatsRange = effectiveRange;

                    } catch (err) {
                        console.error('加载统计数据失败:', err);
                    }
                },

                // 加载各服务器实时在线人数明细与总人数
                loadOnlineDetail: async function() {
                    var el = document.getElementById('live-online-summary');
                    if (!el) return;
                    try {
                        var resp = await fetch('/api/online/detail', {
                            headers: { 'Authorization': 'Bearer ' + w.apiPassword }
                        });
                        var data = await resp.json();
                        if (!data.success || !data.data) {
                            el.textContent = '';
                            return;
                        }
                        var d = data.data;
                        var parts = [];
                        if (d.servers && d.servers.length) {
                            for (var i = 0; i < d.servers.length; i++) {
                                var sv = d.servers[i];
                                parts.push(sv.address + ': ' + (sv.online === null ? '--' : sv.online));
                            }
                        }
                        var totalText = (d.total === null || d.total === undefined) ? '--' : d.total;
                        el.textContent = '当前总在线: ' + totalText + (parts.length ? '（' + parts.join(' | ') + '）' : '');
                    } catch (err) {
                        el.textContent = '';
                    }
                },

                // 调整所有图表尺寸（窗口resize时调用）
                resizeAllCharts: function() {
                    if (w.cpuCharts) {
                        for (var i = 0; i < w.cpuCharts.length; i++) {
                            w.cpuCharts[i].resize();
                        }
                    }
                    if (w.memChart) w.memChart.resize();
                    if (w.netChart) w.netChart.resize();
                    if (w.onlineChart) w.onlineChart.resize();
                    if (w.immersiveChart) w.immersiveChart.resize();
                },

                // 初始化性能监控图表（内存、网络、CPU核心）
                initPerformanceCharts: function() {
                    var self = this;
                    var checkMem = function() {
                        var el = document.getElementById('mem-chart');
                        if (el && el.offsetHeight > 0 && !w.memChart) {
                            w.memChart = echarts.init(el);
                            w.memChart.setOption({
                                tooltip: { trigger: 'axis' },
                                grid: { top: 28, bottom: 3, left: '1%', right: '5%', containLabel: true },
                                xAxis: { type: 'category', data: [], axisLabel: { interval: 5, rotate: 30,
                                        fontSize: 9, margin: 8 } },
                                yAxis: { type: 'value', name: '%', min: 0, max: 100 },
                                series: [{ type: 'line', data: [], smooth: false, color: '#2196f3',
                                    lineStyle: { color: '#2196f3' }, areaStyle: { opacity: 0.2,
                                        color: '#2196f3' } }]
                            });
                        }
                    };
                    var checkNet = function() {
                        var el = document.getElementById('net-chart');
                        if (el && el.offsetHeight > 0 && !w.netChart) {
                            w.netChart = echarts.init(el);
                            w.netChart.setOption({
                                tooltip: { trigger: 'axis' },
                                grid: { top: 28, bottom: 3, left: '1%', right: '5%', containLabel: true },
                                xAxis: { type: 'category', data: [], axisLabel: { interval: 5, rotate: 30,
                                        fontSize: 9, margin: 8 } },
                                yAxis: { type: 'value', name: 'Mbps' },
                                series: [
                                    { name: '上传', type: 'line', data: [], color: '#ff9800',
                                        lineStyle: { color: '#ff9800' }, areaStyle: { opacity: 0.2,
                                            color: '#ff9800' } },
                                    { name: '下载', type: 'line', data: [], color: '#4caf50',
                                        lineStyle: { color: '#4caf50' }, areaStyle: { opacity: 0.2,
                                            color: '#4caf50' } }
                                ]
                            });
                        }
                    };
                    checkMem();
                    checkNet();
                    // 如果元素还没渲染，延迟重试
                    if (!w.memChart || !w.netChart) {
                        setTimeout(function() { self.initPerformanceCharts(); }, 100);
                    }
                    this.resizeAllCharts();
                },

                // 启动定时刷新（每30秒）
                startAutoRefresh: function() {
                    if (w.statsRefreshTimer) clearInterval(w.statsRefreshTimer);
                    var self = this;
                    w.statsRefreshTimer = setInterval(function() {
                        if (w.currentTab === 'stats') {
                            self.loadOnlineStats(w.currentStatsRange);
                            self.loadOnlineDetail();
                        }
                    },30000);
                },

                // 停止定时刷新
                stopAutoRefresh: function() {
                    if (w.statsRefreshTimer) {
                        clearInterval(w.statsRefreshTimer);
                        w.statsRefreshTimer = null;
                    }
                }
            };
            // ============================================================
            // 日志加载器 s（分段加载）
            // ============================================================
            var s = {
                enabled: false,
                initialized: false,
                totalLines: 0,
                loadedUpTo: 0,
                loading: false,
                chunkSize: 1000,
                stopFlag: false,
                progressDiv: null,

                start: async function() {
                    if (this.initialized || this.enabled) return;
                    this.enabled = true;
                    this.stopFlag = false;
                    this.progressDiv = h.elements.progressDiv;
                    await this.resetAndClear();
                    if (!this.stopFlag && this.loadedUpTo < this.totalLines) {
                        this.loadNextChunk();
                    }
                },

                resetAndClear: async function() {
                    this.loadedUpTo = 0;
                    if (h.elements.consoleContainer) {
                        h.elements.consoleContainer.innerHTML = '';
                    }
                    this.updateProgress(0, 0);
                    try {
                        var resp = await fetch('/api/log/total_lines', {
                            headers: { 'Authorization': 'Bearer ' + w.apiPassword }
                        });
                        var data = await resp.json();
                        this.totalLines = data.total;
                        this.updateProgress(0, this.totalLines);
                    } catch (err) {
                        console.error('获取总行数失败', err);
                        this.totalLines = 0;
                        this.enabled = false;
                        if (this.progressDiv) this.progressDiv.textContent = ' 加载失败';
                    }
                },

                loadNextChunk: function() {
                    if (this.stopFlag || !this.enabled || this.loading) return;
                    if (this.loadedUpTo >= this.totalLines) {
                        this.updateProgress(this.totalLines, this.totalLines);
                        this.enabled = false;
                        d.refresh();
                        return;
                    }
                    this.loading = true;
                    var start = this.loadedUpTo;
                    var count = Math.min(this.chunkSize, this.totalLines - start);
                    var self = this;

                    fetch('/api/log/range?start=' + start + '&count=' + count, {
                        headers: { 'Authorization': 'Bearer ' + w.apiPassword }
                    }).then(function(resp) { return resp.json(); }).then(function(data) {
                        if (data.lines && data.lines.length) {
                            var container = h.elements.consoleContainer;
                            if (container) {
                                var frag = document.createDocumentFragment();
                                for (var i = 0; i < data.lines.length; i++) {
                                    frag.appendChild(h.createLogLineElement(data.lines[i]));
                                }
                                var oldHeight = container.scrollHeight;
                                var oldScroll = container.scrollTop;
                                var wasAtBottom = S.isContainerAtBottom(container);
                                container.appendChild(frag);
                                if (wasAtBottom && w.autoScrollEnabled) {
                                    S.smoothScrollToBottomDynamic(container, 100);
                                } else if (oldScroll > 0 && !wasAtBottom) {
                                    var delta = container.scrollHeight - oldHeight;
                                    container.scrollTop = oldScroll + delta;
                                }
                                d.refresh();
                            }
                            self.loadedUpTo += data.lines.length;
                            self.updateProgress(self.loadedUpTo, self.totalLines);
                        }
                        self.loading = false;
                        if (!self.stopFlag && self.loadedUpTo < self.totalLines) {
                            setTimeout(function() { self.loadNextChunk(); }, 50);
                        } else {
                            self.updateProgress(self.totalLines, self.totalLines);
                            self.enabled = false;
                            d.refresh();
                        }
                    }).catch(function(err) {
                        console.error('加载日志块失败', err);
                        self.enabled = false;
                        if (self.progressDiv) self.progressDiv.textContent = ' ⚠ 加载失败';
                        self.loading = false;
                    });
                },

                updateProgress: function(loaded, total) {
                    if (!this.progressDiv) return;
                    if (total === 0) {
                        this.progressDiv.textContent = ' 计算行数...';
                        this.progressDiv.style.display = '';
                        return;
                    }
                    if (loaded >= total) {
                        this.progressDiv.style.display = 'none';
                    } else {
                        this.progressDiv.style.display = '';
                        var pct = ((loaded / total) * 100).toFixed(1);
                        this.progressDiv.textContent = ' 📄 加载日志 ' + loaded + '/' + total + ' (' + pct + '%)';
                    }
                },

                stop: function() {
                    this.stopFlag = true;
                    this.enabled = false;
                    if (this.progressDiv) this.progressDiv.textContent = '';
                }
            };

            // ============================================================
            // 标签切换 l
            // ============================================================
            async function l(tab) {
                w.currentTab = tab;
                document.querySelectorAll('.tab-button').forEach(function(btn) {
                    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
                });
                document.querySelectorAll('.tab-content').forEach(function(el) {
                    el.classList.remove('active');
                });
                document.getElementById('tab-' + tab).classList.add('active');

                if (tab === 'console') {
                    d.refresh();
                    setTimeout(function() { d.updateScaleAndIndicator(); }, 100);
                    o.stopAutoRefresh();
                } else if (tab === 'stats') {
                    s.stop();
                    var activeBtn = document.querySelector('#range-selector .range-btn.active');
                    var range = activeBtn ? activeBtn.getAttribute('data-range') : '7d';
                    w.currentStatsRange = range;
                    await o.loadOnlineStats(range);
                    o.loadOnlineDetail();
                    o.initPerformanceCharts();
                    if (w.onlineChart) {
                        setTimeout(function() { w.onlineChart.resize(); }, 100);
                    }
                    o.startAutoRefresh();
                } else {
                    s.stop();
                    h.updateNonConsoleTab();
                    o.stopAutoRefresh();
                }
            }

            // ============================================================
            // 登录流程 c
            // ============================================================
            async function c() {
                var password = await new Promise(function(resolve) {
                    var modal = document.createElement('div');
                    modal.className = 'modal';
                    modal.innerHTML =
                        `
                    <div class="modal-card">
                        <h3>请输入访问密码</h3>
                        <input type="password" id="pwd-input" placeholder="密码">
                        <button id="pwd-submit">确认</button>
                    </div>
                `;
                    document.body.appendChild(modal);
                    var input = modal.querySelector('#pwd-input');
                    var btn = modal.querySelector('#pwd-submit');
                    var submit = function() {
                        var val = input.value;
                        if (val) {
                            modal.remove();
                            resolve(val);
                        } else {
                            alert('密码不能为空');
                        }
                    };
                    btn.onclick = submit;
                    input.onkeypress = function(e) {
                        if (e.key === 'Enter') submit();
                    };
                    input.focus();
                });

                try {
                    var testResp = await fetch('/api/log/total_lines', {
                        headers: { 'Authorization': 'Bearer ' + password }
                    });
                    if (testResp.status === 401) {
                        alert('密码错误');
                        return c();
                    }
                    w.apiPassword = password;
                    h.showStatus('验证成功，加载数据...', 2000);
                    h.elements.immersiveBtn.style.display = 'flex';
                    h.elements.rconToggleBtn.style.display = 'flex';

                    // 加载原始日志（用于初始化各记录）
                    var rawResp = await fetch('/api/latest_raw', {
                        headers: { 'Authorization': 'Bearer ' + password }
                    });
                    var rawText = await rawResp.text();
                    r.refreshAllDataFromRaw(rawText);

                    // 启动WebSocket
                    a.init();

                    // 切换到控制台
                    await l('console');
                    h.showStatus('就绪', 2000);

                    // 显示RCON窗口
                    if (h.elements.rconWindow) {
                        var win = h.elements.rconWindow;
                        win.style.display = 'flex';
                        var left = (window.innerWidth - win.offsetWidth) / 2;
                        var top = (window.innerHeight - win.offsetHeight) / 2;
                        win.style.left = left + 'px';
                        win.style.top = top + 'px';
                        win.style.bottom = '';
                        win.style.right = '';
                    }

                    d.refresh();

                } catch (err) {
                    alert('网络错误，请检查后端');
                    return c();
                }
            }

            // ============================================================
            // Grim 分割条拖动
            // ============================================================
            (function() {
                var divider = document.getElementById('grim-divider');
                var leftPanel = document.getElementById('grim-left-panel');
                var parent = divider ? divider.parentElement : null;
                if (!divider || !leftPanel || !parent) return;

                var isDragging = false;
                var startX = 0;
                var startWidth = 0;

                function setWidth(percent) {
                    percent = Math.min(90, Math.max(10, percent));
                    leftPanel.style.width = percent + '%';
                    return percent;
                }

                function onStart(e) {
                    e.preventDefault();
                    var ev = e.touches ? e.touches[0] : e;
                    isDragging = true;
                    divider.classList.add('dragging');
                    startX = ev.clientX;
                    startWidth = leftPanel.getBoundingClientRect().width;
                    document.body.style.userSelect = 'none';
                    document.body.style.webkitUserSelect = 'none';
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onEnd);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onEnd);
                    document.addEventListener('touchcancel', onEnd);
                }

                function onMove(e) {
                    if (!isDragging) return;
                    e.preventDefault();
                    var ev = e.touches ? e.touches[0] : e;
                    var dx = ev.clientX - startX;
                    var containerWidth = parent.getBoundingClientRect().width;
                    if (containerWidth <= 0) return;
                    var dividerWidth = divider.offsetWidth || 6;
                    var usableWidth = containerWidth - dividerWidth;
                    var percent = ((startWidth + dx) / usableWidth) * 100;
                    setWidth(percent);
                }

                function onEnd() {
                    if (isDragging) {
                        isDragging = false;
                        divider.classList.remove('dragging');
                        document.body.style.userSelect = '';
                        document.body.style.webkitUserSelect = '';
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onEnd);
                        document.removeEventListener('touchmove', onMove);
                        document.removeEventListener('touchend', onEnd);
                        document.removeEventListener('touchcancel', onEnd);
                    }
                }

                divider.addEventListener('mousedown', onStart);
                divider.addEventListener('touchstart', onStart, { passive: false });

                divider.addEventListener('dblclick', function() {
                    setWidth(50);
                });
            })();

            // ============================================================
            // 主启动流程
            // ============================================================
            (async function() {
                // 加载高亮规则
                try {
                    var hr = await fetch('/api/highlight_rules');
                    var hrData = await hr.json();
                    w.highlightRules = Array.isArray(hrData) ? hrData : [];
                } catch (e) {
                    w.highlightRules = [];
                }

                // 加载反作弊关键词
                try {
                    var ak = await fetch('/api/anticheat_keywords');
                    var akData = await ak.json();
                    w.anticheatKeywords = Array.isArray(akData) ? akData : [];
                } catch (e) {
                    w.anticheatKeywords = [];
                }

                // 初始化界面
                h.init();

                // 标签切换事件
                document.querySelectorAll('.tab-button').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        l(btn.getAttribute('data-tab'));
                    });
                });

                // 统计范围选择事件（修改：直接调用 o.loadOnlineStats，高亮由内部统一）
                document.getElementById('range-selector').addEventListener('click', function(e) {
                    var btn = e.target.closest('.range-btn');
                    if (btn) {
                        var range = btn.getAttribute('data-range');
                        o.loadOnlineStats(range);
                    }
                });

                // 启动登录
                await c();
            })();

        })();
    </script>
</body>
</html>
