    server_properties_path: 'D:\.MC_server\MSL\Server2\server.properties' # 服务器 server.properties 文件绝对路径
    public_server_addresses: # 玩家加入的服务器IP。这将用于人数统计。
      - "7891.ovvo.space"
    crash_recovery_commands: # 如果检测到服务器崩溃时，就执行这些批处理命令。
      - "taskkill /F /T /IM java.exe"
      - "taskkill /F /T /IM frpc_custom.exe"
      - "taskkill /F /T /IM MSL.exe"
