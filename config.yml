######################## 崩溃检查 ########################
alert_keywords: # 当日志行出现以下文本时，会检查 服务器目录文件下 是否新生成crash崩溃日志，判断是否真的崩溃了
  - "shutdown"
  - "crash"
crash_confirm_delay_seconds: 10 # 当日志行出现"crash"时，间隔几秒，检查是否生成crash日志。（一般保持默认10）
alert_cooldown_seconds: 20 # 如果检测到服务器崩溃时，就发送邮件通知（如果你配置好了的话）。发送邮件后，几秒之内不会再次发送。默认20


######################## 前端日志 ########################
# [优先级问题] 顺序不同 可能会导致颜色配置失效。从上到下，优先级从高到低。不区分大小写
highlight_rules:
  # 黄色
  - keyword: "/WARN]"
    color: "#fbff00"
  # 红色
  - keyword: "Server empty for"
    color: "#ff0000"
  - keyword: "error"
    color: "#ff0000"
  # 青色
  - keyword: "触发了"
    color: "#00ffea"
  - keyword: "Grim"
    color: "#00ffea"
  - keyword: "[Rcon]"
    color: "#00ffea"
  - keyword: "[Server]"
    color: "#00ffea"
  # 灰色
  - keyword: "lost connection"
    color: "#666666"
  - keyword: "left the game"
    color: "#666666"
  - keyword: "voicechat"
    color: "#666666"
  - keyword: "Disconnecting"
    color: "#666666"
  - keyword: "Thread RCON"
    color: "#666666"
  - keyword: "issued server command"
    color: "#666666"
  # 绿色
  - keyword: "logged in with entity"
    color: "#3BF010"


# 包含这些词的日志行，会默认出现在前端"反作弊日志"标签页，并同步写入 AntiCheatLog_<服务器名>.txt
anticheat_keywords:
  - "触发了"
  - "[Server]"


# 日志过滤关键词（包含这些词的日志行,不会显示在前端）
filter_keywords:
  - "PacketEvents caught an unhandled exception while calling your listener"
  - "generated an exception while executing task"
  - "java.lang."
  - "\tat"
  - "failed to"
  - "voicechat"
  - "Named entity "