      smtp_port: 25 # 邮箱的smtp服务器 端口 (默认:网易邮箱25)
      user: "" # 发件人的用户名
      from: "" # 发件人邮箱号
      to: "" # 收件人邮箱
      password: "" # 发件人 的 发件授权码（不是邮箱登录密码）| 以网易163邮箱为例：电脑端前往 发件人的邮箱 > 设置 > POP3/SMTP/IMAP > 开启 [POP3(或IMAP)/SMTP] 服务 > 获取授权码 > 填入这个 {password} 中。
